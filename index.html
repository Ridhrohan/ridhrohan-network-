<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIDHROHAN NETWORK</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#07111f;
  color:white;
}

.login{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:390px;
  background:#101c2c;
  padding:30px 25px;
  border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
  text-align:center;
}

.logo{
  width:75px;
  height:75px;
  margin:auto;
  border-radius:20px;
  background:#087cff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
}

h1{
  margin-top:18px;
  font-size:25px;
}

.subtitle{
  color:#9eacbd;
  margin:8px 0 25px;
}

input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:1px solid #2c3d52;
  border-radius:10px;
  background:#081321;
  color:white;
  font-size:15px;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:0;
  border-radius:10px;
  background:#087cff;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.error{
  color:#ff6675;
  margin-top:12px;
  display:none;
}

.dashboard{
  display:none;
  min-height:100vh;
}

.header{
  height:65px;
  background:#101c2c;
  display:flex;
  align-items:center;
  padding:0 20px;
  border-bottom:1px solid #243448;
}

.header strong{
  font-size:19px;
}

.menu{
  width:240px;
  background:#0d1827;
  position:fixed;
  top:65px;
  bottom:0;
  left:0;
  padding:20px 12px;
}

.menu div{
  padding:14px;
  margin-bottom:5px;
  border-radius:8px;
  color:#bdc8d6;
}

.menu div.active,
.menu div:hover{
  background:#087cff;
  color:white;
}

.content{
  margin-left:240px;
  padding:25px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.card{
  background:#101c2c;
  padding:20px;
  border-radius:14px;
  border:1px solid #233449;
}

.card small{
  color:#9eacbd;
}

.card h2{
  margin-top:10px;
}

.welcome{
  margin-bottom:20px;
}

.logout{
  margin-top:20px;
  background:#e5394f;
  max-width:200px;
}

@media(max-width:700px){
  .menu{
    position:static;
    width:100%;
  }

  .content{
    margin-left:0;
  }

  .cards{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:450px){
  .cards{
    grid-template-columns:1fr;
  }
}
  .login{
  min-height:100vh;
  height:auto;
  overflow:visible;
  padding:30px 20px;
}

.login-box{
  height:auto;
  min-height:0;
  max-height:none;
  overflow:visible;
}

.login-box input{
  display:block;
  visibility:visible;
  opacity:1;
}

.login-box button{
  display:block;
  visibility:visible;
  opacity:1;
    }
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="loginPage">

  <div class="login-box">

    <div class="logo">RN</div>

    <h1>RIDHROHAN NETWORK</h1>

    <div class="subtitle">
      Network Management System
    </div>

    <input
      type="text"
      id="username"
      placeholder="Username"
      autocomplete="username"
    >

    <input
      type="password"
      id="password"
      placeholder
