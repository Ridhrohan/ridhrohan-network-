<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RIDHROHAN NETWORK</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Segoe UI,sans-serif;
background:#07111f;
color:#eaf2ff;
min-height:100vh
}

button,input,select{font:inherit}
button{cursor:pointer}

.top{
height:60px;
background:#0b1930;
border-bottom:1px solid #1b3557;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
position:sticky;
top:0;
z-index:20
}

.brand{font-weight:800;letter-spacing:.5px}

.brand small{
display:block;
color:#7fa1c9;
font-size:10px;
font-weight:400;
margin-top:2px
}

.menuBtn{
background:#102642;
border:1px solid #28496f;
color:white;
border-radius:10px;
padding:9px 12px;
font-size:20px
}

.layout{
display:flex;
min-height:calc(100vh - 60px)
}

.side{
width:250px;
background:#09172a;
border-right:1px solid #1b3557;
padding:14px;
flex-shrink:0
}

.side button,.sub button{
width:100%;
border:0;
background:transparent;
color:#b9cce3;
text-align:left;
padding:12px 13px;
border-radius:9px;
margin:2px 0
}

.side button:hover,
.side button.active,
.sub button:hover{
background:#123158;
color:white
}

.section{
margin-top:14px;
color:#607fa4;
font-size:10px;
text-transform:uppercase;
padding:8px 13px
}

.sub{
display:none;
padding-left:10px
}

.sub.open{display:block}

.arrow{float:right}

.main{
flex:1;
padding:18px;
max-width:1400px;
margin:auto;
width:100%
}

.pageTitle{
font-size:24px;
font-weight:800;
margin-bottom:5px
}

.muted{
color:#7f9bbd;
font-size:13px
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin:20px 0
}

.card,.panel{
background:#0b1b31;
border:1px solid #1b3557;
border-radius:13px;
padding:16px
}

.card .num{
font-size:28px;
font-weight:800;
margin-top:8px
}

.card .label{
color:#7f9bbd;
font-size:12px
}

.grid{
display:grid;
grid-template-columns:1.3fr .7fr;
gap:14px
}

.panel h3{margin-bottom:14px}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap
}

.btn{
border:0;
border-radius:9px;
padding:10px 13px;
background:#16477c;
color:#fff
}

.btn.green{background:#087f62}
.btn.red{background:#9b3041}
.btn.gray{background:#263b55}
.btn.orange{background:#9a641d}

.tableWrap{overflow:auto}

.table{
width:100%;
border-collapse:collapse;
min-width:700px
}

.table th,.table td{
padding:11px 9px;
border-bottom:1px solid #1a304c;
text-align:left;
font-size:13px
}

.table th{
color:#7695b8;
font-size:11px;
text-transform:uppercase
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:99px;
font-size:10px;
font-weight:700
}

.active{
background:#0c6b52;
color:#9effdd
}

.inactive{
background:#7a2735;
color:#ffd0d7
}

.expired{
background:#7a2735;
color:#ffd0d7
}

.disabled{
background:#39485a;
color:#d2dbe6
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.72);
z-index:50;
align-items:center;
justify-content:center;
padding:15px
}

.modal.show{display:flex}

.box{
background:#0b1b31;
border:1px solid #2a4b70;
border-radius:15px;
padding:18px;
width:min(500px,100%);
max-height:90vh;
overflow:auto
}

.box h2{margin-bottom:15px}

.field{margin:10px 0}

.field label{
display:block;
color:#8da8c7;
font-size:12px;
margin-bottom:6px
}

.field input,.field select{
width:100%;
background:#071321;
color:#fff;
border:1px solid #29496d;
border-radius:9px;
padding:11px;
outline:0
}

.modalBtns{
display:flex;
gap:8px;
margin-top:15px
}

.modalBtns button{flex:1}

.notice{
padding:13px;
border:1px dashed #315579;
border-radius:10px;
color:#9db7d5;
margin-top:10px;
font-size:13px
}

.empty{
text-align:center;
color:#718eae;
padding:30px
}

.txid{
font-size:10px;
color:#6f8cac
}

.bottom{display:none}

@media(max-width:850px){

.side{
position:fixed;
left:-270px;
top:60px;
bottom:0;
z-index:30;
transition:.2s;
box-shadow:10px 0 30px #0008
}

.side.show{left:0}

.main{padding:14px}

.cards{
grid-template-columns:repeat(2,1fr)
}

.grid{grid-template-columns:1fr}

}

@media(max-width:520px){

.cards{
grid-template-columns:repeat(2,1fr);
gap:8px
}

.card{padding:12px}

.card .num{font-size:22px}

.pageTitle{font-size:20px}

.bottom{
display:flex;
position:fixed;
bottom:0;
left:0;
right:0;
height:58px;
background:#09172a;
border-top:1px solid #1b3557;
z-index:25;
justify-content:space-around;
align-items:center
}

.bottom button{
background:none;
border:0;
color:#7896b7;
font-size:10px
}

.bottom b{
display:block;
font-size:19px;
color:#dcecff;
margin-bottom:2px
}

.main{padding-bottom:75px}

}
</style>
</head>

<body>

<header class="top">

<div class="brand">
RIDHROHAN NETWORK
<small>Network Management System</small>
</div>

<button class="menuBtn" onclick="toggleMenu()">☰</button>

</header>

<div class="layout">

<aside class="side" id="side">

<button class="active" onclick="showPage('dashboard',this)">
⌂ &nbsp; Dashboard
</button>

<button onclick="showPage('ecash',this)">
₱ &nbsp; ECash
</button>

<button onclick="togglePPPoE()">
◉ &nbsp; PPPoE
<span class="arrow">⌄</span>
</button>

<div class="sub open" id="pppoeSub">

<button onclick="showPage('servers',this)">
Servers
</button>

<button onclick="showPage('plans',this)">
Plans
</button>

<button onclick="showPage('clients',this)">
Clients
</button>

<button onclick="showPage('transactions',this)">
Transactions
</button>

<button onclick="showPage('active',this)">
Active Connections
</button>

<button onclick="showPage('cron',this)">
Cron Logs
</button>

</div>

<button onclick="showPage('pppoev2',this)">
◉ &nbsp; PPPoE V2
</button>

<button onclick="showPage('ipoe',this)">
◉ &nbsp; IPoE
</button>

<button onclick="showPage('mikrotik',this)">
⚙ &nbsp; Mikrotik
</button>

<button onclick="showPage('payments',this)">
₱ &nbsp; Payments
</button>

<button onclick="showPage('support',this)">
? &nbsp; Support Center
</button>

<div class="section">Settings</div>

<button onclick="showPage('account',this)">
Account
</button>

<button onclick="showPage('disbursement',this)">
Disbursement
</button>

<button onclick="showPage('telegram',this)">
Telegram Notification
</button>

<button onclick="logout()">
Sign out
</button>

</aside>

<main class="main" id="app"></main>

</div>

<nav class="bottom">

<button onclick="showPage('dashboard')">
<b>⌂</b>Home
</button>

<button onclick="showPage('clients')">
<b>◉</b>Clients
</button>

<button onclick="openClient()">
<b>＋</b>Add
</button>

<button onclick="showPage('payments')">
<b>₱</b>Payments
</button>

<button onclick="toggleMenu()">
<b>☰</b>Menu
</button>

</nav>


<!-- CLIENT MODAL -->

<div class="modal" id="clientModal">

<div class="box">

<h2>Add PPPoE Client</h2>

<div class="field">
<label>Client Name</label>
<input id="fName" placeholder="Juan Dela Cruz">
</div>

<div class="field">
<label>Username</label>
<input id="fUser" placeholder="juan123">
</div>

<div class="field">
<label>Plan</label>
<select id="fPlan"></select>
</div>

<div class="field">
<label>Due Date</label>
<input id="fDue" type="date">
</div>

<div class="modalBtns">

<button class="btn gray" onclick="closeModal('clientModal')">
Cancel
</button>

<button class="btn green" onclick="saveClient()">
Save Client
</button>

</div>

</div>
</div>


<!-- PLAN MODAL -->

<div class="modal" id="planModal">

<div class="box">

<h2 id="planModalTitle">Add PPPoE Plan</h2>

<input type="hidden" id="editPlanIndex">

<div class="field">
<label>Plan Name</label>
<input id="pName" placeholder="25 Mbps">
</div>

<div class="field">
<label>Speed</label>
<input id="pSpeed" placeholder="25 Mbps">
</div>

<div class="field">
<label>Monthly Price (₱)</label>
<input id="pPrice" type="number" min="1" placeholder="1000">
</div>

<div class="field">
<label>Status</label>
<select id="pStatus">
<option value="ACTIVE">ACTIVE</option>
<option value="INACTIVE">INACTIVE</option>
</select>
</div>

<div class="modalBtns">

<button class="btn gray"
onclick="closeModal('planModal')">
Cancel
</button>

<button class="btn green"
onclick="savePlan()">
Save Plan
</button>

</div>

</div>
</div>


<script>

"use strict";


var clients=[];
var payments=[];
var plans=[];


/* DEFAULT PLANS */

var defaultPlans=[
{
name:"10 Mbps",
speed:"10 Mbps",
price:500,
status:"ACTIVE"
},
{
name:"15 Mbps",
speed:"15 Mbps",
price:700,
status:"ACTIVE"
},
{
name:"25 Mbps",
speed:"25 Mbps",
price:1000,
status:"ACTIVE"
},
{
name:"50 Mbps",
speed:"50 Mbps",
price:1500,
status:"ACTIVE"
}
];


/* LOAD DATA */

function safeLoad(){

try{

var c=localStorage.getItem("RN_CLIENTS");
var p=localStorage.getItem("RN_PAYMENTS");
var pl=localStorage.getItem("RN_PLANS");

clients=c?JSON.parse(c):[];
payments=p?JSON.parse(p):[];
plans=pl?JSON.parse(pl):defaultPlans.slice();

if(!Array.isArray(clients))clients=[];
if(!Array.isArray(payments))payments=[];
if(!Array.isArray(plans)||plans.length===0){
plans=defaultPlans.slice();
}

}catch(e){

clients=[];
payments=[];
plans=defaultPlans.slice();

}

saveData();

}


/* SAVE */

function saveData(){

try{

localStorage.setItem(
"RN_CLIENTS",
JSON.stringify(clients)
);

localStorage.setItem(
"RN_PAYMENTS",
JSON.stringify(payments)
);

localStorage.setItem(
"RN_PLANS",
JSON.stringify(plans)
);

}catch(e){}

}


/* ESCAPE */

function esc(v){

return String(v==null?"":v)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* MONEY */

function money(n){

return "₱"+
Number(n||0).toLocaleString("en-PH");

}


/* STATUS */

function statusOf(c){

if(c.disabled)return"DISABLED";

if(!c.due)return"ACTIVE";

var today=new Date();

today.setHours(0,0,0,0);

var d=new Date(c.due+"T00:00:00");

return d<today?"EXPIRED":"ACTIVE";

}


/* BADGE */

function badge(s){

var cls=
s==="ACTIVE"
?"active":
s==="INACTIVE"
?"inactive":
s==="EXPIRED"
?"expired":
"disabled";

return '<span class="badge '+cls+'">'+
s+
'</span>';

}


/* TRANSACTION ID */

function createTransactionID(){

return "RN-"+
Date.now()+"-"+
Math.floor(Math.random()*9000+1000);

}


/* CARD */

function card(label,value){

return '<div class="card">'+
'<div class="label">'+label+'</div>'+
'<div class="num">'+value+'</div>'+
'</div>';

}


/* RENDER */

function render(page){

var app=document.getElementById("app");

if(!app)return;


var active=clients.filter(function(c){
return statusOf(c)==="ACTIVE";
}).length;

var expired=clients.filter(function(c){
return statusOf(c)==="EXPIRED";
}).length;

var disabled=clients.filter(function(c){
return statusOf(c)==="DISABLED";
}).length;

var total=payments.reduce(function(a,p){
return a+Number(p.amount||0);
},0);


/* DASHBOARD */

if(page==="dashboard"){

app.innerHTML=

'<div class="pageTitle">Dashboard</div>'+
'<div class="muted">RIDHROHAN NETWORK overview</div>'+

'<div class="cards">'+
card("Clients",clients.length)+
card("Active",active)+
card("Expired",expired)+
card("Collected",money(total))+
'</div>'+

'<div class="grid">'+

'<div class="panel">'+

'<h3>Quick Actions</h3>'+

'<div class="actions">'+

'<button class="btn green" onclick="openClient()">'+
'＋ Add PPPoE Client'+
'</button>'+

'<button class="btn" onclick="showPage(\'clients\')">'+
'View Clients'+
'</button>'+

'<button class="btn gray" onclick="showPage(\'payments\')">'+
'Payment History'+
'</button>'+

'</div>'+

'<div class="notice">'+
'Prototype mode: data is stored only in this browser. MikroTik connection is not enabled yet.'+
'</div>'+

'</div>'+

'<div class="panel">'+

'<h3>System</h3>'+

'<p class="muted">PPPoE Clients: '+
clients.length+
'</p>'+

'<p class="muted" style="margin-top:8px">'+
'Plans: '+
plans.length+
'</p>'+

'<p class="muted" style="margin-top:8px">'+
'Disabled: '+
disabled+
'</p>'+

'<p class="muted" style="margin-top:8px">'+
'Payments: '+
payments.length+
'</p>'+

'</div>'+

'</div>';

return;

}


/* PLANS */

if(page==="plans"){

renderPlans(app);

return;

}


/* CLIENTS */

if(page==="clients"){

renderClients(app);

return;

}


/* PAYMENTS */

if(page==="payments"||page==="transactions"){

renderPayments(app);

return;

}


/* OTHER PAGES */

var titles={

ecash:"ECash",
servers:"PPPoE Servers",
active:"Active Connections",
cron:"Cron Logs",
pppoev2:"PPPoE V2",
ipoe:"IPoE",
mikrotik:"Mikrotik",
support:"Support Center",
account:"Account",
disbursement:"Disbursement",
telegram:"Telegram Notification"

};

var title=titles[page]||"Dashboard";


app.innerHTML=

'<div class="pageTitle">'+
esc(title)+
'</div>'+

'<div class="muted">RIDHROHAN NETWORK</div>'+

'<div class="panel" style="margin-top:20px">'+

'<h3>'+
esc(title)+
'</h3>'+

'<p class="muted">'+
'This module is ready for the next configuration.'+
'</p>'+

'<div class="notice">'+
'Hindi pa ito nakakonekta sa MikroTik. UI at data structure muna bago secure backend/API connection.'+
'</div>'+

'</div>';

}


/* PLANS PAGE */

function renderPlans(app){

var rows="";

plans.forEach(function(p,i){

rows+=

'<tr>'+

'<td>'+
esc(p.name)+
'</td>'+

'<td>'+
esc(p.speed)+
'</td>'+

'<td>'+
money(p.price)+
'</td>'+

'<td>'+
badge(p.status)+
'</td>'+

'<td>'+

'<div class="actions">'+

'<button class="btn" onclick="editPlan('+i+')">'+
'Edit'+
'</button>'+

'<button class="btn gray" onclick="togglePlan('+i+')">'+
(p.status==="ACTIVE"?"Deactivate":"Activate")+
'</button>'+

'<button class="btn red" onclick="deletePlan('+i+')">'+
'Delete'+
'</button>'+

'</div>'+

'</td>'+

'</tr>';

});


if(!rows){

rows=
'<tr>'+
'<td colspan="5" class="empty">'+
'No plans yet.'+
'</td>'+
'</tr>';

}


app.innerHTML=

'<div class="pageTitle">PPPoE Plans</div>'+

'<div class="muted">'+
'Manage internet packages and monthly pricing'+
'</div>'+

'<div class="panel" style="margin-top:20px">'+

'<div class="actions" style="margin-bottom:15px">'+

'<button class="btn green" onclick="openPlan()">'+
'＋ Add Plan'+
'</button>'+

'</div>'+

'<div class="tableWrap">'+

'<table class="table">'+

'<thead>'+

'<tr>'+
'<th>Plan Name</th>'+
'<th>Speed</th>'+
'<th>Monthly Price</th>'+
'<th>Status</th>'+
'<th>Action</th>'+
'</tr>'+

'</thead>'+

'<tbody>'+
rows+
'</tbody>'+

'</table>'+

'</div>'+

'</div>';

}


/* CLIENT PAGE */

function renderClients(app){

var rows="";

clients.forEach(function(c,i){

var s=statusOf(c);

var paidButton=
s==="DISABLED"

?
'<button class="btn orange" onclick="paidDisabled('+i+')">Paid</button>'

:
'<button class="btn green" onclick="paid('+i+')">Paid</button>';


rows+=

'<tr>'+

'<td>'+esc(c.name)+'</td>'+

'<td>'+esc(c.user)+'</td>'+

'<td>'+esc(c.plan)+'</td>'+

'<td>'+money(c.fee)+'</td>'+

'<td>'+esc(c.due||"-")+'</td>'+

'<td>'+badge(s)+'</td>'+

'<td>'+

'<div class="actions">'+

paidButton+

'<button class="btn gray" onclick="toggleDisable('+i+')">'+
(c.disabled?"Enable":"Disable")+
'</button>'+

'<button class="btn red" onclick="removeClient('+i+')">'+
'Delete'+
'</button>'+

'</div>'+

'</td>'+

'</tr>';

});


if(!rows){

rows=
'<tr>'+
'<td colspan="7" class="empty">'+
'No PPPoE clients yet.'+
'</td>'+
'</tr>';

}


app.innerHTML=

'<div class="pageTitle">PPPoE Clients</div>'+

'<div class="muted">'+
'Manage clients, due dates and payments'+
'</div>'+

'<div class="panel" style="margin-top:20px">'+

'<div class="actions" style="margin-bottom:15px">'+

'<button class="btn green" onclick="openClient()">'+
'＋ Add Client'+
'</button>'+

'</div>'+

'<div class="tableWrap">'+

'<table class="table">'+

'<thead>'+

'<tr>'+
'<th>Name</th>'+
'<th>Username</th>'+
'<th>Plan</th>'+
'<th>Fee</th>'+
'<th>Due</th>'+
'<th>Status</th>'+
'<th>Action</th>'+
'</tr>'+

'</thead>'+

'<tbody>'+
rows+
'</tbody>'+

'</table>'+

'</div>'+

'</div>';

}


/* PAYMENT PAGE */

function renderPayments(app){

var total=payments.reduce(function(a,p){

return a+Number(p.amount||0);

},0);

var rows="";

payments.slice().reverse().forEach(function(p){

rows+=

'<tr>'+

'<td>'+esc(p.client)+'</td>'+

'<td>'+esc(p.username||"-")+'</td>'+

'<td>'+money(p.amount)+'</td>'+

'<td>'+esc(p.method||"Cash")+'</td>'+

'<td>'+esc(p.date||"")+'</td>'+

'<td>'+esc(p.previousDue||"-")+'</td>'+

'<td>'+esc(p.newDue||"-")+'</td>'+

'<td class="txid">'+
esc(p.transactionId||"-")+
'</td>'+

'</tr>';

});


if(!rows){

rows=
'<tr>'+
'<td colspan="8" class="empty">'+
'No payments recorded.'+
'</td>'+
'</tr>';

}


app.innerHTML=

'<div class="pageTitle">Payments</div>'+

'<div class="muted">'+
'Payment history and collection'+
'</div>'+

'<div class="cards">'+

card("Total Collected",money(total))+
card("Transactions",payments.length)+

'</div>'+

'<div class="panel">'+

'<div class="tableWrap">'+

'<table class="table">'+

'<thead>'+

'<tr>'+
'<th>Client</th>'+
'<th>Username</th>'+
'<th>Amount</th>'+
'<th>Method</th>'+
'<th>Date</th>'+
'<th>Previous Due</th>'+
'<th>New Due</th>'+
'<th>Transaction</th>'+
'</tr>'+

'</thead>'+

'<tbody>'+
rows+
'</tbody>'+

'</table>'+

'</div>'+

'</div>';

}


/* MENU */

function showPage(page,btn){

render(page);

if(btn){

var all=
document.querySelectorAll(".side button");

all.forEach(function(x){
x.classList.remove("active");
});

btn.classList.add("active");

}

if(window.innerWidth<=850){

document.getElementById("side")
.classList.remove("show");

}

}


function toggleMenu(){

document.getElementById("side")
.classList.toggle("show");

}


function togglePPPoE(){

document.getElementById("pppoeSub")
.classList.toggle("open");

}


/* MODAL */

function closeModal(id){

document.getElementById(id)
.classList.remove("show");

}


/* OPEN CLIENT */

function openClient(){

var select=
document.getElementById("fPlan");

select.innerHTML="";

var activePlans=
plans.filter(function(p){
return p.status==="ACTIVE";
});


if(activePlans.length===0){

alert(
"Walang ACTIVE PPPoE Plan.\n\n"+
"Gumawa muna ng plan sa PPPoE → Plans."
);

return;

}


activePlans.forEach(function(p){

var option=document.createElement("option");

option.value=p.name;

option.textContent=
p.name+
" — "+
money(p.price)+
"/month";

select.appendChild(option);

});


document.getElementById("fName").value="";
document.getElementById("fUser").value="";


var d=new Date();

d.setMonth(d.getMonth()+1);

document.getElementById("fDue")
.value=d.toISOString().slice(0,10);


document.getElementById("clientModal")
.classList.add("show");

}


/* PLAN MODAL */

function openPlan(){

document.getElementById("editPlanIndex").value="";

document.getElementById("planModalTitle")
.textContent="Add PPPoE Plan";

document.getElementById("pName").value="";
document.getElementById("pSpeed").value="";
document.getElementById("pPrice").value="";
document.getElementById("pStatus").value="ACTIVE";

document.getElementById("planModal")
.classList.add("show");

}


/* SAVE PLAN */

function savePlan(){

var name=
document.getElementById("pName")
.value.trim();

var speed=
document.getElementById("pSpeed")
.value.trim();

var price=
Number(
document.getElementById("pPrice")
.value||0
);

var status=
document.getElementById("pStatus")
.value;

var edit=
document.getElementById("editPlanIndex")
.value;


if(!name||!speed){

alert(
"Ilagay ang Plan Name at Speed."
);

return;

}


if(price<=0){

alert(
"Ilagay ang tamang Monthly Price."
);

return;

}


var duplicate=plans.some(function(p,index){

return p.name.toLowerCase()===
name.toLowerCase() &&
String(index)!==String(edit);

});


if(duplicate){

alert(
"May existing plan na may ganitong pangalan."
);

return;

}


var obj={
name:name,
speed:speed,
price:price,
status:status
};


if(edit===""){

plans.push(obj);

}else{

plans[Number(edit)]=obj;

}


saveData();

closeModal("planModal");

render("plans");

}


/* EDIT PLAN */

function editPlan(i){

var p=plans[i];

if(!p)return;

document.getElementById("editPlanIndex")
.value=i;

document.getElementById("planModalTitle")
.textContent="Edit PPPoE Plan";

document.getElementById("pName")
.value=p.name;

document.getElementById("pSpeed")
.value=p.speed;

document.getElementById("pPrice")
.value=p.price;

document.getElementById("pStatus")
.value=p.status;

document.getElementById("planModal")
.classList.add("show");

}
