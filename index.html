<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Segoe UI,sans-serif;
background:#07111f;
color:#eaf2ff;
min-height:100vh

button,input,select{font:inherit}
button{cursor:pointer}

.top{

justify-content:space-between;

.brand{

.side{

table{

th,td{

th{

}

.badge{

}

.disabled{

}

.modal{

position:fixed;
inset:0;
background:#000b;
align-items:center;
justify-content:center;
padding:15px;
z-index:50
}

.modal.show{

}

.box{
width:100%;
max-width:480px;
background:#0b1b31;
border:1px solid #315579;
border-radius:14px;
padding:18px
}

.field{
margin:12px 0
}

.field label{
display:block;
color:#91aac8;
font-size:12px;
margin-bottom:6px
}

.field input,
.field select{
width:100%;
padding:11px;
border-radius:8px;
border:1px solid #315579;
background:#071321;
color:#fff
}

.modalActions{
display:flex;
gap:8px;

.modalActions button{

.notice{

padding:13px;

.side{
position:fixed;
top:62px;
bottom:0;
left:-270px;
z-index:30;
transition:.2s;
box-shadow:8px 0 30px #0008
}

.side.show{
left:0

grid-template-columns:repeat(2,1fr)
}

}

padding:14px 14px 75px
}

.title{
font-size:22px
}

.cards{
gap:8px
}

.card{
padding:13px
}

.card strong{
font-size:22px
}

.bottom{
display:flex;
position:fixed;
bottom:0;
left:0;
right:0;
height:60px;
background:#09172a;
border-top:1px solid #1b3557;

}

.bottom button{
background:none;
border:0;
color:#9bb1ca;
font-size:11px
}

.bottom b{

color:#fff;
font-size:20px
}

}
</style>
</head>

<div class="box">

<input id="cUser"
placeholder="juan123">

</div>

<select id="cPlan"></select>

<input id="cDue" type="date">

</h2>

<script>

"use strict";


var clients=[];

var payments=[];

var plans=[];


var defaultPlans=[

{
name:"10 Mbps",
speed:"10 Mbps",
price:500,
status:"ACTIVE"
},

{
name:"15 Mbps",
speed:"15 Mbps",
price:700,
status:"ACTIVE"
},

{
name:"25 Mbps",
speed:"25 Mbps",
price:1000,
status:"ACTIVE"
},

{
name:"50 Mbps",
speed:"50 Mbps",
price:1500,
status:"ACTIVE"
}

];


function load(){

try{

clients=JSON.parse(
localStorage.getItem("RN_CLIENTS")||"[]"
);

payments=JSON.parse(
localStorage.getItem("RN_PAYMENTS")||"[]"
);

plans=JSON.parse(
localStorage.getItem("RN_PLANS")||"null"
);

}catch(e){

clients=[];
payments=[];
plans=null;

}


if(!Array.isArray(clients))
clients=[];

if(!Array.isArray(payments))
payments=[];

if(!Array.isArray(plans)||!plans.length){

plans=defaultPlans.map(function(p){

return Object.assign({},p);

});

}


save();

}


function save(){

try{

localStorage.setItem(
"RN_CLIENTS",
JSON.stringify(clients)
);

localStorage.setItem(
"RN_PAYMENTS",
JSON.stringify(payments)
);

localStorage.setItem(
"RN_PLANS",
JSON.stringify(plans)
);

}catch(e){

alert("Hindi ma-save ang browser data.");

}

}


function esc(x){

return String(x==null?"":x)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;");

}


function money(x){

return "₱"+
Number(x||0).toLocaleString("en-PH");

}


function status(c){

if(c.disabled)
return "DISABLED";

if(!c.due)
return "ACTIVE";

var d=new Date(
c.due+"T00:00:00"
);

var t=new Date();

t.setHours(0,0,0,0);

return d<t ? "EXPIRED" : "ACTIVE";

}


function badge(s){

var cls=
s==="ACTIVE"
?"active"
:s==="DISABLED"
?"disabled"
:"inactive";

return '<span class="badge '+cls+'">'+
esc(s)+
'</span>';

}


function card(a,b){

return '<div class="card">'+
'<span>'+esc(a)+'</span>'+
'<strong>'+b+'</strong>'+
'</div>';

}


function go(p,b){

if(p==="dashboard")
dashboard();

else if(p==="plans")
plansPage();

else if(p==="clients")
clientsPage();

else if(
p==="payments"||
p==="transactions"
)
paymentsPage();

else
simplePage(p);


if(b){

document
.querySelectorAll(".side button")
.forEach(function(x){

x.classList.remove("active");

});

b.classList.add("active");

}


if(window.innerWidth<851){

document
.getElementById("side")
.classList.remove("show");

}

}


/* DASHBOARD */

function dashboard(){

var active=clients.filter(
function(c){
return status(c)==="ACTIVE";
}
).length;


var expired=clients.filter(
function(c){
return status(c)==="EXPIRED";
}
).length;


var total=payments.reduce(
function(s,p){

return s+
Number(p.amount||0);

},
0
);


document.getElementById("app").innerHTML=

'<div class="title">'+
'Dashboard'+
'</div>'+

'<div class="muted">'+
'RIDHROHAN NETWORK overview'+
'</div>'+

'<div class="cards">'+

card("Clients",clients.length)+

card("Active",active)+

card("Expired",expired)+

card("Collected",money(total))+

'</div>'+

'<div class="panel">'+

'<h2>Quick Actions</h2>'+
'<br>'+

'<div class="actions">'+

'<button class="btn green" onclick="openClient()">'+
'＋ Add PPPoE Client'+
'</button>'+

'<button class="btn" onclick="go(\'clients\')">'+
'View Clients'+
'</button>'+

'<button class="btn gray" onclick="go(\'plans\')">'+
'Manage Plans'+
'</button>'+

'<button class="btn gray" onclick="go(\'payments\')">'+
'Payment History'+
'</button>'+

'</div>'+

'<div class="notice">'+
'Prototype mode. Hindi pa nakakonekta sa MikroTik.'+
'</div>'+

'</div>';

}


/* PLANS */

function plansPage(){

var rows="";


plans.forEach(function(p,i){

rows+=

'<tr>'+

'<td>'+esc(p.name)+'</td>'+

'<td>'+esc(p.speed)+'</td>'+

'<td>'+money(p.price)+'</td>'+

'<td>'+badge(p.status)+'</td>'+

'<td>'+

'<div class="actions">'+

'<button class="btn" onclick="editPlan('+i+')">'+
'Edit'+
'</button>'+

'<button class="btn gray" onclick="togglePlan('+i+')">'+
(p.status==="ACTIVE"
?"Deactivate"
:"Activate")+
'</button>'+

'<button class="btn red" onclick="deletePlan('+i+')">'+
'Delete'+
'</button>'+

'</div>'+

'</td>'+

'</tr>';

});


document.getElementById("app").innerHTML=

'<div class="title">PPPoE Plans</div>'+

'<div class="muted">'+
'Manage internet packages and monthly pricing'+
'</div>'+

'<div class="panel">'+

'<button class="btn green" onclick="openPlan()">'+
'＋ Add Plan'+
'</button>'+

'<br><br>'+

'<div class="tablebox">'+

'<table>'+

'<tr>'+

'<th>PLAN NAME</th>'+
'<th>SPEED</th>'+
'<th>MONTHLY PRICE</th>'+
'<th>STATUS</th>'+
'<th>ACTION</th>'+

'</tr>'+

(
rows||
'<tr><td colspan="5">No plans yet.</td></tr>'
)+

'</table>'+

'</div>'+

'</div>';

}


function openPlan(){

document.getElementById(
"pEdit"
).value="";


document.getElementById(
"planTitle"
).innerText=
"Add PPPoE Plan";


document.getElementById(
"pName"
).value="";


document.getElementById(
"pSpeed"
).value="";


document.getElementById(
"pPrice"
).value="";


document.getElementById(
"pStatus"
).value="ACTIVE";


document.getElementById(
"planModal"
).classList.add("show");

}


function closePlan(){

document
.getElementById("planModal")
.classList.remove("show");

}


function savePlan(){

var n=
document.getElementById("pName")
.value.trim();


var s=
document.getElementById("pSpeed")
.value.trim();


var price=
Number(
document.getElementById("pPrice")
.value||0
);


var edit=
document.getElementById("pEdit")
.value;


if(!n||!s||price<=0){

alert(
"Complete Plan Name, Speed at Price."
);

return;

}


var obj={

name:n,

speed:s,

price:price,

status:
document.getElementById("pStatus")
.value

};


if(edit==="")

plans.push(obj);

else

plans[Number(edit)]=obj;


save();

closePlan();

plansPage();

}


function editPlan(i){

var p=plans[i];


document.getElementById(
"pEdit"
).value=i;


document.getElementById(
"planTitle"
).innerText=
"Edit PPPoE Plan";


document.getElementById(
"pName"
).value=p.name;


document.getElementById(
"pSpeed"
).value=p.speed;


document.getElementById(
"pPrice"
).value=p.price;


document.getElementById(
"pStatus"
).value=p.status;


document.getElementById(
"planModal"
).classList.add("show");

}


function togglePlan(i){

plans[i].status=
plans[i].status==="ACTIVE"
?"INACTIVE"
:"ACTIVE";

save();

plansPage();

}


function deletePlan(i){

var used=clients.some(
function(c){

return c.plan===plans[i].name;

}
);


if(used){

alert(
"Hindi puwedeng i-delete. Ginagamit pa ng client."
);

return;

}


if(
confirm(
"Delete "+plans[i].name+"?"
)
){

plans.splice(i,1);

save();

plansPage();

}

}


/* CLIENTS */

function clientsPage(){

var rows="";


clients.forEach(function(c,i){

rows+=

'<tr>'+

'<td>'+esc(c.name)+'</td>'+

'<td>'+esc(c.user)+'</td>'+

'<td>'+esc(c.plan)+'</td>'+

'<td>'+money(c.fee)+'</td>'+

'<td>'+esc(c.due||"-")+'</td>'+

'<td>'+badge(status(c))+'</td>'+

'<td>'+

'<button class="btn green" onclick="pay('+i+')">'+
'Paid'+
'</button> '+

'<button class="btn gray" onclick="disableClient('+i+')">'+
(c.disabled?"Enable":"Disable")+
'</button> '+

'<button class="btn red" onclick="delClient('+i+')">'+
'Delete'+
'</button>'+

'</td>'+

'</tr>';

});


document.getElementById("app").innerHTML=

'<div class="title">'+
'PPPoE Clients'+
'</div>'+

'<div class="muted">'+
'Manage clients, plans and due dates'+
'</div>'+

'<div class="panel">'+

'<button class="btn green" onclick="openClient()">'+
'＋ Add Client'+
'</button>'+

'<br><br>'+

'<div class="tablebox">'+

'<table>'+

'<tr>'+

'<th>NAME</th>'+
'<th>USERNAME</th>'+
'<th>PLAN</th>'+
'<th>FEE</th>'+
'<th>DUE</th>'+
'<th>STATUS</th>'+
'<th>ACTION</th>'+

'</tr>'+

(
rows||
'<tr><td colspan="7">No clients yet.</td></tr>'
)+

'</table>'+

'</div>'+

'</div>';

}


/* ADD CLIENT */

function openClient(){

var active=
plans.filter(function(p){

return p.status==="ACTIVE";

});


if(!active.length){

alert("Walang ACTIVE plan.");

return;

}


var sel=
document.getElementById("cPlan");


sel.innerHTML="";


active.forEach(function(p){

var o=
document.createElement("option");


o.value=p.name;


o.textContent=
p.name+
" — "+
money(p.price)+
"/month";


sel.appendChild(o);

});


document.getElementById(
"cName"
).value="";


document.getElementById(
"cUser"
).value="";


var d=new Date();

d.setMonth(
d.getMonth()+1
);


document.getElementById(
"cDue"
).value=
d.toISOString().slice(0,10);


document.getElementById(
"clientModal"
).classList.add("show");

}


function closeClient(){

document
.getElementById("clientModal")
.classList.remove("show");

}


function saveClient(){

var n=
document.getElementById("cName")
.value.trim();


var u=
document.getElementById("cUser")
.value.trim();


var pn=
document.getElementById("cPlan")
.value;


var due=
document.getElementById("cDue")
.value;


var p=
plans.find(function(x){

return x.name===pn;

});


if(!n||!u||!p){

alert(
"Complete ang Client Name, Username at Plan."
);

return;

}


var duplicate=
clients.some(function(c){

return c.user.toLowerCase()===
u.toLowerCase();

});


if(duplicate){

alert(
"May gumagamit na ng username na ito."
);

return;

}


clients.push({

name:n,

user:u,

plan:p.name,

speed:p.speed,

fee:p.price,

due:due,

disabled:false

});


save();

closeClient();

clientsPage();

}


/* PAYMENT */

function pay(i){

var c=clients[i];


if(!c){

alert("Client not found.");

return;

}


if(c.disabled){

alert(
"Disabled ang client. I-enable muna bago mag-record ng payment."
);

return;

}


var amount=
Number(c.fee||0);


if(amount<=0){

alert(
"Invalid ang payment amount."
);

return;

}


var method=
prompt(
"PAYMENT METHOD\n\n"+
"I-type: GCash, Maya o Cash",
"Cash"
);


if(!method)
return;


method=method.trim();


var m=
method.toLowerCase();


if(
m!=="gcash"&&
m!=="maya"&&
m!=="cash"
){

alert(
"Payment method: GCash, Maya o Cash lamang."
);

return;

}


var ok=
confirm(

"CONFIRM PAYMENT\n\n"+

"Client: "+c.name+"\n"+

"Username: "+c.user+"\n"+

"Plan: "+c.plan+"\n"+

"Amount: "+money(amount)+"\n"+

"Method: "+method+"\n\n"+

"Record payment?"

);


if(!ok)
return;


var oldDue=c.due;


var d=
oldDue
?new Date(oldDue+"T00:00:00")
:new Date();


if(isNaN(d.getTime())){

d=new Date();

}


var today=new Date();

today.setHours(
0,0,0,0
);


if(d<today){

d=new Date();

}


d.setMonth(
d.getMonth()+1
);


var newDue=
d.toISOString().slice(0,10);


c.due=newDue;

c.disabled=false;


payments.push({

transactionId:
"RN-"+Date.now(),

client:c.name,

username:c.user,

plan:c.plan,

amount:amount,

method:method,

oldDue:oldDue||"",

newDue:newDue,

date:
new Date()
.toISOString()
.slice(0,10),

time:
new Date()
.toLocaleTimeString()

});


save();


alert(

"PAYMENT SUCCESSFUL!\n\n"+

"Client: "+c.name+"\n"+

"Amount: "+money(amount)+"\n"+

"Method: "+method+"\n"+

"New Due Date: "+newDue

);


clientsPage();

}


/* ENABLE / DISABLE */

function disableClient(i){

if(!clients[i])
return;


clients[i].disabled=
!clients[i].disabled;


save();

clientsPage();

}


/* DELETE CLIENT */
