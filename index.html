<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RIDHROHAN NETWORK</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font-family:Arial,sans-serif}.top{height:76px;background:#102033;display:flex;align-items:center;padding:0 25px;position:sticky;top:0;z-index:5}.menu{font-size:35px;margin-right:22px;cursor:pointer}.brand{font-size:27px;font-weight:800}.side{position:fixed;top:76px;bottom:0;left:-300px;width:280px;background:#0d1b2c;padding:22px 15px;z-index:10;transition:.2s;overflow:auto}.side.open{left:0}.nav{padding:15px;border-radius:12px;color:#b8c6d8;font-size:20px;cursor:pointer}.nav:hover,.nav.active{background:#1680ee;color:#fff}.sub{display:none;padding-left:15px}.sub.show{display:block}.main{padding:40px 30px 80px}h1{font-size:44px;margin:0 0 8px}.subt{font-size:24px;color:#9eafc5;margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#122237;border:1px solid #29415d;border-radius:26px;padding:26px;margin-top:20px}.label{color:#a9b8cb;font-size:19px}.value{font-size:38px;font-weight:800;margin-top:14px}.online,.active{display:inline-block;background:#075c3d;color:#62e7a5;padding:9px 16px;border-radius:25px;font-weight:800}.expired{display:inline-block;background:#5e1820;color:#ff9aa5;padding:9px 16px;border-radius:25px;font-weight:800}.btn{border:0;border-radius:12px;padding:12px 17px;color:#fff;background:#1680ee;font-weight:700;margin:3px;cursor:pointer}.green{background:#0c9b67}.red{background:#e9455b}.gray{background:#29415d}.table{overflow:auto}table{width:100%;min-width:850px;border-collapse:collapse}th,td{text-align:left;padding:16px;border-bottom:1px solid #29415d}th{color:#9fb0c5}.modalbg{display:none;position:fixed;inset:0;background:#000b;z-index:30;align-items:center;justify-content:center;padding:18px}.modalbg.show{display:flex}.modal{background:#122237;border:1px solid #29415d;border-radius:24px;padding:25px;width:min(520px,100%);max-height:90vh;overflow:auto}.modal h2{margin-top:0;font-size:30px}label{display:block;color:#a9b8cb;margin:13px 0 6px}input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #38516d;background:#07111f;color:#fff}.actions{display:flex;gap:10px;margin-top:20px}.actions button{flex:1}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.brand{font-size:22px}.main{padding:30px 18px}.grid{grid-template-columns:1fr}h1{font-size:38px}}
</style></head><body>
<header class="top"><div class="menu" onclick="toggle()">☰</div><div class="brand">RIDHROHAN NETWORK</div></header>
<aside class="side" id="side">
<div class="nav active" onclick="dash()">Dashboard</div><div class="nav">ECash</div>
<div class="nav" onclick="sub('pp')">PPPoE ▸</div><div class="sub" id="pp"><div class="nav" onclick="simple('PPPoE Servers')">Servers</div><div class="nav" onclick="simple('PPPoE Plans')">Plans</div><div class="nav" onclick="clientsPage()">Clients</div><div class="nav" onclick="simple('Transactions')">Transactions</div><div class="nav" onclick="simple('Active Connections')">Active Connections</div><div class="nav" onclick="simple('Cron Logs')">Cron Logs</div></div>
<div class="nav">PPPoE V2</div><div class="nav">IPoE</div><div class="nav">Mikrotik</div><div class="nav">Payments</div><div class="nav">Support Center</div><div class="nav">Settings</div></aside>
<main class="main" id="app"></main>
<div class="modalbg" id="mb"><div class="modal" id="modal"></div></div>
<script>
let clients=JSON.parse(localStorage.getItem('RN_CLIENTS')||'[]'),payments=JSON.parse(localStorage.getItem('RN_PAYMENTS')||'[]');
const app=document.getElementById('app');
function save(){localStorage.setItem('RN_CLIENTS',JSON.stringify(clients));localStorage.setItem('RN_PAYMENTS',JSON.stringify(payments))}
function today(){return new Date().toISOString().slice(0,10)} function st(c){return c.due<today()?'EXPIRED':'ACTIVE'} function peso(n){return '₱'+Number(n||0).toLocaleString('en-PH')}
function toggle(){side.classList.toggle('open')} function sub(x){document.getElementById(x).classList.toggle('show')}
function dash(){side.classList.remove('open');let a=clients.filter(x=>st(x)=='ACTIVE').length,total=payments.reduce((s,x)=>s+Number(x.amount||0),0);app.innerHTML='<h1>Dashboard</h1><div class="subt">Network Management System</div><div class="grid"><div class="card"><div class="label">Total Clients</div><div class="value">'+clients.length+'</div></div><div class="card"><div class="label">Active Connections</div><div class="value">'+a+'</div></div><div class="card"><div class="label">Payments</div><div class="value">'+peso(total)+'</div></div><div class="card"><div class="label">System Status</div><div class="value"><span class="online">ONLINE</span></div></div></div><div class="card"><h2>Quick Actions</h2><button class="btn" onclick="add()">＋ Add PPPoE Client</button><button class="btn green" onclick="clientsPage()">View Clients</button></div>'}
function clientsPage(){side.classList.remove('open');app.innerHTML='<h1>PPPoE Clients</h1><div class="subt">Manage clients, due dates and payments.</div><div class="card"><button class="btn" onclick="add()">＋ Add PPPoE Client</button><div class="table"><table><tr><th>Client</th><th>Username</th><th>Plan</th><th>Fee</th><th>Due</th><th>Status</th><th>Actions</th></tr>'+ (clients.length?clients.map((c,i)=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.user)+'</td><td>'+c.plan+'</td><td>'+peso(c.fee)+'</td><td>'+c.due+'</td><td><span class="'+(st(c)=='ACTIVE'?'active':'expired')+'">'+st(c)+'</span></td><td>'+(st(c)=='EXPIRED'?'<button class="btn green" onclick="paid('+i+')">Mark Paid</button>':'<button class="btn gray" onclick="disable('+i+')">Disable</button>')+'<button class="btn red" onclick="del('+i+')">Delete</button></td></tr>').join(''):'<tr><td colspan="7">Wala pang client.</td></tr>')+'</table></div></div>'}
function add(){mb.classList.add('show');modal.innerHTML='<h2>Add PPPoE Client</h2><label>Client Name</label><input id="n" placeholder="Juan Dela Cruz"><label>PPPoE Username</label><input id="u" placeholder="juan123"><label>Plan</label><select id="p"><option>10 Mbps</option><option selected>25 Mbps</option><option>50 Mbps</option><option>100 Mbps</option><option>200 Mbps</option><option>400 Mbps</option></select><label>Monthly Fee</label><input id="f" type="number" value="1000"><label>Due Date</label><input id="d" type="date"><div class="actions"><button class="btn green" onclick="saveClient()">Save Client</button><button class="btn gray" onclick="mb.classList.remove('show')">Cancel</button></div>'}
function saveClient(){if(!n.value||!u.value||!d.value){alert('Paki-fill lahat.');return}clients.push({name:n.value,user:u.value,plan:p.value,fee:Number(f.value||0),due:d.value});save();mb.classList.remove('show');clientsPage()}
function paid(i){let c=clients[i],x=new Date(c.due+'T00:00:00');x.setMonth(x.getMonth()+1);c.due=x.toISOString().slice(0,10);payments.push({client:c.name,amount:c.fee,date:today(),method:'Cash'});save();clientsPage();alert('Paid! New due date: '+c.due)}
function disable(i){clients[i].disabled=true;save();clientsPage()} function del(i){if(confirm('Delete this client?')){clients.splice(i,1);save();clientsPage()}}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function simple(t){side.classList.remove('open');app.innerHTML='<h1>'+t+'</h1><div class="subt">Module ready.</div><div class="card"><p style="color:#a9b8cb">Tatapusin muna natin ang dashboard functions bago ikonekta sa actual MikroTik.</p></div>'}
dash();
</script></body></html>
