<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIDHROHAN NETWORK</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#07111f;color:#eaf2ff;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}
.top{height:62px;background:#0b1930;border-bottom:1px solid #244363;display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:20}
.brand{font-size:20px;font-weight:bold}.brand small{display:block;color:#89a6c8;font-size:11px;font-weight:normal;margin-top:3px}
.menu{background:#102b4b;color:white;border:1px solid #315579;border-radius:10px;padding:9px 13px;font-size:22px}
.layout{display:flex;min-height:calc(100vh - 62px)}
.side{width:250px;background:#09172a;border-right:1px solid #1b3557;padding:12px}
.side button{width:100%;border:0;background:none;color:#b9cce3;text-align:left;padding:12px;border-radius:9px;margin:2px 0}
.side button:hover,.side button.active{background:#14375f;color:white}
.sub{display:none;padding-left:10px}.sub.open{display:block}
.main{flex:1;padding:20px;max-width:1400px;width:100%;margin:auto}
.title{font-size:26px;font-weight:bold;margin-bottom:5px}.muted{color:#86a3c5;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.card,.panel{background:#0b1b31;border:1px solid #1d3b60;border-radius:14px;padding:17px}
.card span{color:#8ba7c8;font-size:13px}.card strong{display:block;font-size:27px;margin-top:8px}
.panel{margin-top:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:9px;padding:10px 14px;color:white;background:#19538c}
.green{background:#07805f}.red{background:#9b3041}.gray{background:#30465f}.orange{background:#91601d}
.tablebox{overflow:auto}table{width:100%;min-width:700px;border-collapse:collapse}
th,td{padding:12px 9px;border-bottom:1px solid #1b3552;text-align:left;font-size:13px}
th{color:#7e9abb;font-size:11px}.badge{padding:5px 8px;border-radius:20px;font-size:10px;font-weight:bold}
.active{background:#0b6c53;color:#aaffdf}.inactive{background:#6d2936;color:#ffd3d8}.disabled{background:#3b4857;color:#dce5ee}
.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:15px;z-index:50}
.modal.show{display:flex}.box{width:100%;max-width:480px;background:#0b1b31;border:1px solid #315579;border-radius:14px;padding:18px}
.field{margin:12px 0}.field label{display:block;color:#91aac8;font-size:12px;margin-bottom:6px}
.field input,.field select{width:100%;padding:11px;border-radius:8px;border:1px solid #315579;background:#071321;color:white}
.modalActions{display:flex;gap:8px;margin-top:16px}.modalActions button{flex:1}
.notice{margin-top:15px;padding:13px;border:1px dashed #315579;border-radius:10px;color:#9bb5d3}
.bottom{display:none}
@media(max-width:850px){
.side{position:fixed;top:62px;bottom:0;left:-270px;z-index:30;transition:.2s;box-shadow:8px 0 30px #0008}
.side.show{left:0}.cards{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:520px){
.main{padding:14px 14px 75px}.title{font-size:22px}.cards{gap:8px}
.card{padding:13px}.card strong{font-size:22px}
.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;height:60px;background:#09172a;border-top:1px solid #1b3557;justify-content:space-around;align-items:center;z-index:25}
.bottom button{background:none;border:0;color:#9bb1ca;font-size:11px}.bottom b{display:block;color:white;font-size:20px}
}
</style>
</head>

<body>

<header class="top">
<div class="brand">RIDHROHAN NETWORK<small>Network Management System</small></div>
<button class="menu" onclick="menuToggle()">☰</button>
</header>

<div class="layout">

<aside class="side" id="side">

<button class="active" onclick="go('dashboard',this)">⌂ &nbsp; Dashboard</button>
<button onclick="go('ecash',this)">₱ &nbsp; ECash</button>

<button onclick="togglePPPoE()">◉ &nbsp; PPPoE &nbsp;⌄</button>

<div class="sub open" id="pppoe">
<button onclick="go('servers',this)">Servers</button>
<button onclick="go('plans',this)">Plans</button>
<button onclick="go('clients',this)">Clients</button>
<button onclick="go('transactions',this)">Transactions</button>
<button onclick="go('connections',this)">Active Connections</button>
<button onclick="go('cron',this)">Cron Logs</button>
</div>

<button onclick="go('pppoev2',this)">◉ &nbsp; PPPoE V2</button>
<button onclick="go('ipoe',this)">◉ &nbsp; IPoE</button>
<button onclick="go('mikrotik',this)">⚙ &nbsp; Mikrotik</button>
<button onclick="go('payments',this)">₱ &nbsp; Payments</button>
<button onclick="go('support',this)">? &nbsp; Support Center</button>

<div style="padding:15px 12px 5px;color:#6684a5;font-size:11px">SETTINGS</div>
<button onclick="go('account',this)">Account</button>
<button onclick="go('disbursement',this)">Disbursement</button>
<button onclick="go('telegram',this)">Telegram Notification</button>

</aside>

<main class="main" id="app"></main>
</div>

<nav class="bottom">
<button onclick="go('dashboard')"><b>⌂</b>Home</button>
<button onclick="go('clients')"><b>◉</b>Clients</button>
<button onclick="openClient()"><b>＋</b>Add</button>
<button onclick="go('payments')"><b>₱</b>Payments</button>
<button onclick="menuToggle()"><b>☰</b>Menu</button>
</nav>


<!-- CLIENT MODAL -->
<div class="modal" id="clientModal">
<div class="box">
<h2>Add PPPoE Client</h2>

<div class="field">
<label>Client Name</label>
<input id="cName" placeholder="Juan Dela Cruz">
</div>

<div class="field">
<label>Username</label>
<input id="cUser" placeholder="juan123">
</div>

<div class="field">
<label>Plan</label>
<select id="cPlan"></select>
</div>

<div class="field">
<label>Due Date</label>
<input id="cDue" type="date">
</div>

<div class="modalActions">
<button class="btn gray" onclick="closeClient()">Cancel</button>
<button class="btn green" onclick="saveClient()">Save Client</button>
</div>
</div>
</div>


<!-- PLAN MODAL -->
<div class="modal" id="planModal">
<div class="box">
<h2 id="planTitle">Add PPPoE Plan</h2>

<input type="hidden" id="pEdit">

<div class="field">
<label>Plan Name</label>
<input id="pName" placeholder="25 Mbps">
</div>

<div class="field">
<label>Speed</label>
<input id="pSpeed" placeholder="25 Mbps">
</div>

<div class="field">
<label>Monthly Price</label>
<input id="pPrice" type="number" placeholder="1000">
</div>

<div class="field">
<label>Status</label>
<select id="pStatus">
<option value="ACTIVE">ACTIVE</option>
<option value="INACTIVE">INACTIVE</option>
</select>
</div>

<div class="modalActions">
<button class="btn gray" onclick="closePlan()">Cancel</button>
<button class="btn green" onclick="savePlan()">Save Plan</button>
</div>
</div>
</div>


<script>

var clients=[];
var payments=[];
var plans=[];

var defaultPlans=[
{name:"10 Mbps",speed:"10 Mbps",price:500,status:"ACTIVE"},
{name:"15 Mbps",speed:"15 Mbps",price:700,status:"ACTIVE"},
{name:"25 Mbps",speed:"25 Mbps",price:1000,status:"ACTIVE"},
{name:"50 Mbps",speed:"50 Mbps",price:1500,status:"ACTIVE"}
];

function load(){

try{
clients=JSON.parse(localStorage.getItem("RN_CLIENTS")||"[]");
payments=JSON.parse(localStorage.getItem("RN_PAYMENTS")||"[]");
plans=JSON.parse(localStorage.getItem("RN_PLANS")||"null");
}catch(e){
clients=[];payments=[];plans=null;
}

if(!Array.isArray(clients))clients=[];
if(!Array.isArray(payments))payments=[];
if(!Array.isArray(plans)||!plans.length)plans=defaultPlans.slice();

save();
}

function save(){
localStorage.setItem("RN_CLIENTS",JSON.stringify(clients));
localStorage.setItem("RN_PAYMENTS",JSON.stringify(payments));
localStorage.setItem("RN_PLANS",JSON.stringify(plans));
}

function esc(x){
return String(x==null?"":x)
.replace(/&/g,"&amp;").replace(/</g,"&lt;")
.replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function money(x){
return "₱"+Number(x||0).toLocaleString("en-PH");
}

function status(c){
if(c.disabled)return"DISABLED";
if(!c.due)return"ACTIVE";
return new Date(c.due+"T00:00:00")<new Date(new Date().toDateString())?"EXPIRED":"ACTIVE";
}

function badge(s){
var c=s==="ACTIVE"?"active":s==="DISABLED"?"disabled":"inactive";
return '<span class="badge '+c+'">'+s+'</span>';
}

function card(a,b){
return '<div class="card"><span>'+a+'</span><strong>'+b+'</strong></div>';
}

function go(p,b){

if(p==="dashboard")dashboard();
else if(p==="plans")plansPage();
else if(p==="clients")clientsPage();
else if(p==="payments"||p==="transactions")paymentsPage();
else simplePage(p);

if(b){
document.querySelectorAll(".side button").forEach(function(x){
x.classList.remove("active");
});
b.classList.add("active");
}

if(innerWidth<851)document.getElementById("side").classList.remove("show");
}

function dashboard(){

var a=clients.filter(function(c){return status(c)==="ACTIVE"}).length;
var e=clients.filter(function(c){return status(c)==="EXPIRED"}).length;
var total=payments.reduce(function(s,p){return s+Number(p.amount||0)},0);

document.getElementById("app").innerHTML=
'<div class="title">Dashboard</div>'+
'<div class="muted">RIDHROHAN NETWORK overview</div>'+
'<div class="cards">'+
card("Clients",clients.length)+
card("Active",a)+
card("Expired",e)+
card("Collected",money(total))+
'</div>'+
'<div class="panel"><h2>Quick Actions</h2><br>'+
'<div class="actions">'+
'<button class="btn green" onclick="openClient()">＋ Add PPPoE Client</button>'+
'<button class="btn" onclick="go(\'clients\')">View Clients</button>'+
'<button class="btn gray" onclick="go(\'plans\')">Manage Plans</button>'+
'<button class="btn gray" onclick="go(\'payments\')">Payment History</button>'+
'</div>'+
'<div class="notice">Prototype mode. Hindi pa nakakonekta sa MikroTik.</div>'+
'</div>';
}

function plansPage(){

var rows="";

plans.forEach(function(p,i){
rows+=
'<tr>'+
'<td>'+esc(p.name)+'</td>'+
'<td>'+esc(p.speed)+'</td>'+
'<td>'+money(p.price)+'</td>'+
'<td>'+badge(p.status)+'</td>'+
'<td><div class="actions">'+
'<button class="btn" onclick="editPlan('+i+')">Edit</button>'+
'<button class="btn gray" onclick="togglePlan('+i+')">'+
(p.status==="ACTIVE"?"Deactivate":"Activate")+
'</button>'+
'<button class="btn red" onclick="deletePlan('+i+')">Delete</button>'+
'</div></td></tr>';
});

document.getElementById("app").innerHTML=
'<div class="title">PPPoE Plans</div>'+
'<div class="muted">Manage internet packages and monthly pricing</div>'+
'<div class="panel">'+
'<button class="btn green" onclick="openPlan()">＋ Add Plan</button><br><br>'+
'<div class="tablebox"><table>'+
'<tr><th>PLAN NAME</th><th>SPEED</th><th>MONTHLY PRICE</th><th>STATUS</th><th>ACTION</th></tr>'+
rows+
'</table></div></div>';
}

function openPlan(){

pEdit.value="";
planTitle.innerText="Add PPPoE Plan";
pName.value="";
pSpeed.value="";
pPrice.value="";
pStatus.value="ACTIVE";
planModal.classList.add("show");

}

function closePlan(){
planModal.classList.remove("show");
}

function savePlan(){

var n=pName.value.trim();
var s=pSpeed.value.trim();
var price=Number(pPrice.value||0);
var edit=pEdit.value;

if(!n||!s||price<=0){
alert("Complete Plan Name, Speed at Price.");
return;
}

plans[edit===""?plans.length:Number(edit)]={
name:n,speed:s,price:price,status:pStatus.value
};

save();
closePlan();
plansPage();

}

function editPlan(i){

var p=plans[i];

pEdit.value=i;
planTitle.innerText="Edit PPPoE Plan";
pName.value=p.name;
pSpeed.value=p.speed;
pPrice.value=p.price;
pStatus.value=p.status;
planModal.classList.add("show");

}

function togglePlan(i){

plans[i].status=
plans[i].status==="ACTIVE"?"INACTIVE":"ACTIVE";

save();
plansPage();

}

function deletePlan(i){

var used=clients.some(function(c){return c.plan===plans[i].name});

if(used){
alert("Hindi puwedeng i-delete. Ginagamit pa ng client.");
return;
}

if(confirm("Delete "+plans[i].name+"?")){
plans.splice(i,1);
save();
plansPage();
}

}

function clientsPage(){

var rows="";

clients.forEach(function(c,i){

rows+=
'<tr>'+
'<td>'+esc(c.name)+'</td>'+
'<td>'+esc(c.user)+'</td>'+
'<td>'+esc(c.plan)+'</td>'+
'<td>'+money(c.fee)+'</td>'+
'<td>'+esc(c.due||"-")+'</td>'+
'<td>'+badge(status(c))+'</td>'+
'<td>'+
'<button class="btn green" onclick="pay('+i+')">Paid</button> '+
'<button class="btn gray" onclick="disable('+i+')">'+
(c.disabled?"Enable":"Disable")+
'</button> '+
'<button class="btn red" onclick="delClient('+i+')">Delete</button>'+
'</td></tr>';

});

document.getElementById("app").innerHTML=
'<div class="title">PPPoE Clients</div>'+
'<div class="muted">Manage clients, plans and due dates</div>'+
'<div class="panel">'+
'<button class="btn green" onclick="openClient()">＋ Add Client</button><br><br>'+
'<div class="tablebox"><table>'+
'<tr><th>NAME</th><th>USERNAME</th><th>PLAN</th><th>FEE</th><th>DUE</th><th>STATUS</th><th>ACTION</th></tr>'+
(rows||'<tr><td colspan="7">No clients yet.</td></tr>')+
'</table></div></div>';

}

function openClient(){

var active=plans.filter(function(p){return p.status==="ACTIVE"});

if(!active.length){
alert("Walang ACTIVE plan.");
return;
}

cPlan.innerHTML="";

active.forEach(function(p){
var o=document.createElement("option");
o.value=p.name;
o.textContent=p.name+" — "+money(p.price)+"/month";
cPlan.appendChild(o);
});

cName.value="";
cUser.value="";

var d=new Date();
d.setMonth(d.getMonth()+1);
cDue.value=d.toISOString().slice(0,10);

clientModal.classList.add("show");

}

function closeClient(){
clientModal.classList.remove("show");
}

function saveClient(){

var n=cName.value.trim();
var u=cUser.value.trim();
var pn=cPlan.value;
var due=cDue.value;

var p=plans.find(function(x){return x.name===pn});

if(!n||!u||!p){
alert("Complete ang Client Name, Username at Plan.");
return;
}

clients.push({
name:n,
user:u,
plan:p.name,
speed:p.speed,
fee:p.price,
due:due,
disabled:false
});

save();
closeClient();
clientsPage();

}

function pay(i){

var c=clients[i];

if(c.disabled){
alert("Enable muna ang client.");
return;
}

if(!confirm(
"Payment: "+money(c.fee)+
"\nClient: "+c.name+
"\n\nContinue?"
))return;

var method=prompt("Payment Method: GCash / Maya / Cash","Cash");

if(!method)return;

var d=new Date(c.due+"T00:00:00");

if(isNaN(d.getTime()))d=new Date();

d.setMonth(d.getMonth()+1);

c.due=d.toISOString().slice(0,10);
c.disabled=false;

payments.push({
client:c.name,
username:c.user,
amount:c.fee,
method:method,
date:new Date().toISOString().slice(0,10),
newDue:c.due,
transactionId:"RN-"+Date.now()
});

save();
alert("Payment recorded.\nNew Due: "+c.due);
clientsPage();

}

function disable(i){

clients[i].disabled=!clients[i].disabled;
save();
clientsPage();

}

function delClient(i){

if(confirm("Delete "+clients[i].name+"?")){
clients.splice(i,1);
save();
clientsPage();
}

}

function paymentsPage(){

var total=payments.reduce(function(s,p){
return s+Number(p.amount||0);
},0);

var rows="";

payments.slice().reverse().forEach(function(p){
rows+=
'<tr>'+
'<td>'+esc(p.client)+'</td>'+
'<td>'+esc(p.username)+'</td>'+
'<td>'+money(p.amount)+'</td>'+
'<td>'+esc(p.method)+'</td>'+
'<td>'+esc(p.date)+'</td>'+
'<td>'+esc(p.newDue)+'</td>'+
'<td>'+esc(p.transactionId)+'</td>'+
'</tr>';
});

document.getElementById("app").innerHTML=
'<div class="title">Payment History</div>'+
'<div class="muted">Recorded payments</div>'+
'<div class="cards">'+
card("Collected",money(total))+
card("Transactions",payments.length)+
'</div>'+
'<div class="panel"><div class="tablebox"><table>'+
'<tr><th>CLIENT</th><th>USERNAME</th><th>AMOUNT</th><th>METHOD</th><th>DATE</th><th>NEW DUE</th><th>TRANSACTION</th></tr>'+
(rows||'<tr><td colspan="7">No payments yet.</td></tr>')+
'</table></div></div>';

}

function simplePage(p){

var names={
ecash:"ECash",
servers:"PPPoE Servers",
connections:"Active Connections",
cron:"Cron Logs",
pppoev2:"PPPoE V2",
ipoe:"IPoE",
mikrotik:"Mikrotik",
support:"Support Center",
account:"Account",
disbursement:"Disbursement",
telegram:"Telegram Notification"
};

var n=names[p]||"RIDHROHAN NETWORK";

document.getElementById("app").innerHTML=
'<div class="title">'+n+'</div>'+
'<div class="muted">RIDHROHAN NETWORK</div>'+
'<div class="panel"><h2>'+n+'</h2>'+
'<div class="notice">Module ready. MikroTik connection is not enabled yet.</div>'+
'</div>';

}

function menuToggle(){
side.classList.toggle("show");
}

function togglePPPoE(){
pppoe.classList.toggle("open");
}

load();
dashboard();

</script>
</body>
</html>
