<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RIDHROHAN NETWORK</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

body{
font-family:Arial,Segoe UI,sans-serif;
background:#07111f;
color:#eaf2ff;
min-height:100vh
}

button,input,select{
font:inherit
}

button{
cursor:pointer
}

.top{
height:60px;
background:#0b1930;
border-bottom:1px solid #1b3557;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 16px;
position:sticky;
top:0;
z-index:20
}

.brand{
font-weight:800;
letter-spacing:.5px
}

.brand small{
display:block;
color:#7fa1c9;
font-size:10px;
font-weight:400;
margin-top:2px
}

.menuBtn{
background:#102642;
border:1px solid #28496f;
color:white;
border-radius:10px;
padding:9px 12px;
font-size:20px
}

.layout{
display:flex;
min-height:calc(100vh - 60px)
}

.side{
width:250px;
background:#09172a;
border-right:1px solid #1b3557;
padding:14px;
flex-shrink:0
}

.side button,
.sub button{
width:100%;
border:0;
background:transparent;
color:#b9cce3;
text-align:left;
padding:12px 13px;
border-radius:9px;
margin:2px 0
}

.side button:hover,
.side button.active,
.sub button:hover{
background:#123158;
color:white
}

.section{
margin-top:14px;
color:#607fa4;
font-size:10px;
text-transform:uppercase;
padding:8px 13px
}

.sub{
display:none;
padding-left:10px
}

.sub.open{
display:block
}

.arrow{
float:right
}

.main{
flex:1;
padding:18px;
max-width:1400px;
margin:auto;
width:100%
}

.pageTitle{
font-size:24px;
font-weight:800;
margin-bottom:5px
}

.muted{
color:#7f9bbd;
font-size:13px
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
margin:20px 0
}

.card,
.panel{
background:#0b1b31;
border:1px solid #1b3557;
border-radius:13px;
padding:16px
}

.card .num{
font-size:28px;
font-weight:800;
margin-top:8px
}

.card .label{
color:#7f9bbd;
font-size:12px
}

.grid{
display:grid;
grid-template-columns:1.3fr .7fr;
gap:14px
}

.panel h3{
margin-bottom:14px
}

.actions{
display:flex;
gap:8px;
flex-wrap:wrap
}

.btn{
border:0;
border-radius:9px;
padding:10px 13px;
background:#16477c;
color:#fff
}

.btn.green{
background:#087f62
}

.btn.red{
background:#9b3041
}

.btn.gray{
background:#263b55
}

.btn.orange{
background:#9a641d
}

.tableWrap{
overflow:auto
}

.table{
width:100%;
border-collapse:collapse;
min-width:850px
}

.table th,
.table td{
padding:11px 9px;
border-bottom:1px solid #1a304c;
text-align:left;
font-size:13px
}

.table th{
color:#7695b8;
font-size:11px;
text-transform:uppercase
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:99px;
font-size:10px;
font-weight:700
}

.active{
background:#0c6b52;
color:#9effdd
}

.expired{
background:#7a2735;
color:#ffd0d7
}

.disabled{
background:#39485a;
color:#d2dbe6
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.72);
z-index:50;
align-items:center;
justify-content:center;
padding:15px
}

.modal.show{
display:flex
}

.box{
background:#0b1b31;
border:1px solid #2a4b70;
border-radius:15px;
padding:18px;
width:min(500px,100%);
max-height:90vh;
overflow:auto
}

.box h2{
margin-bottom:15px
}

.field{
margin:10px 0
}

.field label{
display:block;
color:#8da8c7;
font-size:12px;
margin-bottom:6px
}

.field input,
.field select{
width:100%;
background:#071321;
color:#fff;
border:1px solid #29496d;
border-radius:9px;
padding:11px;
outline:0
}

.modalBtns{
display:flex;
gap:8px;
margin-top:15px
}

.modalBtns button{
flex:1
}

.notice{
padding:13px;
border:1px dashed #315579;
border-radius:10px;
color:#9db7d5;
margin-top:10px;
font-size:13px
}

.successBox{
padding:14px;
border:1px solid #146b58;
background:#082b25;
border-radius:10px;
color:#a5ffe9;
margin-top:12px
}

.empty{
text-align:center;
color:#718eae;
padding:30px
}

.bottom{
display:none
}

.statSmall{
font-size:12px;
color:#7f9bbd;
margin-top:5px
}

.txid{
font-size:10px;
color:#6f8cac
}

@media(max-width:850px){

.side{
position:fixed;
left:-270px;
top:60px;
bottom:0;
z-index:30;
transition:.2s;
box-shadow:10px 0 30px #0008
}

.side.show{
left:0
}

.main{
padding:14px
}

.cards{
grid-template-columns:repeat(2,1fr)
}

.grid{
grid-template-columns:1fr
}

}

@media(max-width:520px){

.cards{
grid-template-columns:repeat(2,1fr);
gap:8px
}

.card{
padding:12px
}

.card .num{
font-size:22px
}

.pageTitle{
font-size:20px
}

.bottom{
display:flex;
position:fixed;
bottom:0;
left:0;
right:0;
height:58px;
background:#09172a;
border-top:1px solid #1b3557;
z-index:25;
justify-content:space-around;
align-items:center
}

.bottom button{
background:none;
border:0;
color:#7896b7;
font-size:10px
}

.bottom b{
display:block;
font-size:19px;
color:#dcecff;
margin-bottom:2px
}

.main{
padding-bottom:75px
}

}
</style>
</head>

<body>

<header class="top">

<div class="brand">
RIDHROHAN NETWORK
<small>Network Management System</small>
</div>

<button class="menuBtn" onclick="toggleMenu()">☰</button>

</header>


<div class="layout">

<aside class="side" id="side">

<button class="active" onclick="showPage('dashboard',this)">
⌂ &nbsp; Dashboard
</button>

<button onclick="showPage('ecash',this)">
₱ &nbsp; ECash
</button>


<button onclick="togglePPPoE()">
◉ &nbsp; PPPoE
<span class="arrow">⌄</span>
</button>

<div class="sub open" id="pppoeSub">

<button onclick="showPage('servers',this)">
Servers
</button>

<button onclick="showPage('plans',this)">
Plans
</button>

<button onclick="showPage('clients',this)">
Clients
</button>

<button onclick="showPage('transactions',this)">
Transactions
</button>

<button onclick="showPage('active',this)">
Active Connections
</button>

<button onclick="showPage('cron',this)">
Cron Logs
</button>

</div>


<button onclick="showPage('pppoev2',this)">
◉ &nbsp; PPPoE V2
</button>

<button onclick="showPage('ipoe',this)">
◉ &nbsp; IPoE
</button>

<button onclick="showPage('mikrotik',this)">
⚙ &nbsp; Mikrotik
</button>

<button onclick="showPage('payments',this)">
₱ &nbsp; Payments
</button>

<button onclick="showPage('support',this)">
? &nbsp; Support Center
</button>


<div class="section">
Settings
</div>

<button onclick="showPage('account',this)">
Account
</button>

<button onclick="showPage('disbursement',this)">
Disbursement
</button>

<button onclick="showPage('telegram',this)">
Telegram Notification
</button>

<button onclick="logout()">
Sign out
</button>

</aside>


<main class="main" id="app"></main>

</div>


<nav class="bottom">

<button onclick="showPage('dashboard')">
<b>⌂</b>
Home
</button>

<button onclick="showPage('clients')">
<b>◉</b>
Clients
</button>

<button onclick="openAdd()">
<b>＋</b>
Add
</button>

<button onclick="showPage('payments')">
<b>₱</b>
Payments
</button>

<button onclick="toggleMenu()">
<b>☰</b>
Menu
</button>

</nav>


<div class="modal" id="clientModal">

<div class="box">

<h2>
Add PPPoE Client
</h2>

<div class="field">
<label>Client Name</label>
<input id="fName" placeholder="Juan Dela Cruz">
</div>

<div class="field">
<label>Username</label>
<input id="fUser" placeholder="juan123">
</div>

<div class="field">
<label>Plan / Speed</label>
<input id="fPlan" placeholder="25 Mbps">
</div>

<div class="field">
<label>Monthly Fee (₱)</label>
<input id="fFee" type="number" min="0" placeholder="1000">
</div>

<div class="field">
<label>Due Date</label>
<input id="fDue" type="date">
</div>

<div class="modalBtns">

<button class="btn gray" onclick="closeModal()">
Cancel
</button>

<button class="btn green" onclick="saveClient()">
Save Client
</button>

</div>

</div>

</div>


<script>

"use strict";


var clients=[];
var payments=[];


function safeLoad(){

try{

var c=localStorage.getItem("RN_CLIENTS");
var p=localStorage.getItem("RN_PAYMENTS");

var parsedC=c?JSON.parse(c):[];
var parsedP=p?JSON.parse(p):[];

clients=Array.isArray(parsedC)?parsedC:[];
payments=Array.isArray(parsedP)?parsedP:[];

}catch(e){

clients=[];
payments=[];

}

}


function saveData(){

try{

localStorage.setItem(
"RN_CLIENTS",
JSON.stringify(clients)
);

localStorage.setItem(
"RN_PAYMENTS",
JSON.stringify(payments)
);

}catch(e){}

}


function esc(v){

return String(v==null?"":v)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function statusOf(c){

if(c.disabled)
return "DISABLED";

if(!c.due)
return "ACTIVE";

var today=new Date();

today.setHours(0,0,0,0);

var d=new Date(c.due+"T00:00:00");

return d<today?"EXPIRED":"ACTIVE";

}


function badge(s){

var cls=
s==="ACTIVE"
?"active"
:s==="EXPIRED"
?"expired"
:"disabled";

return '<span class="badge '+cls+'">'+s+'</span>';

}


function money(n){

return "₱"+
Number(n||0).toLocaleString("en-PH");

}


function createTransactionID(){

var now=Date.now();

var random=Math.floor(
Math.random()*9000
)+1000;

return "RN-"+now+"-"+random;

}


function render(page){

var app=document.getElementById("app");

if(!app)return;


var active=clients.filter(function(c){

return statusOf(c)==="ACTIVE";

}).length;


var expired=clients.filter(function(c){

return statusOf(c)==="EXPIRED";

}).length;


var disabled=clients.filter(function(c){

return statusOf(c)==="DISABLED";

}).length;


var total=payments.reduce(function(a,p){

return a+Number(p.amount||0);

},0);


if(page==="dashboard"){

app.innerHTML=

'<div class="pageTitle">Dashboard</div>'+

'<div class="muted">'+
'RIDHROHAN NETWORK overview'+
'</div>'+

'<div class="cards">'+

card("Clients",clients.length)+
card("Active",active)+
card("Expired",expired)+
card("Collected",money(total))+

'</div>'+

'<div class="grid">'+

'<div class="panel">'+

'<h3>Quick Actions</h3>'+

'<div class="actions">'+

'<button class="btn green" onclick="openAdd()">'+
'＋ Add PPPoE Client'+
'</button>'+

'<button class="btn" onclick="showPage(\'clients\')">'+
'View Clients'+
'</button>'+

'<button class="btn gray" onclick="showPage(\'payments\')">'+
'Payment History'+
'</button>'+

'</div>'+

'<div class="notice">'+
'Prototype mode: data is stored only in this browser. MikroTik connection is not enabled yet.'+
'</div>'+

'</div>'+

'<div class="panel">'+

'<h3>System</h3>'+

'<p class="muted">PPPoE: '+clients.length+' clients</p>'+

'<p class="muted" style="margin-top:8px">'+
'Disabled: '+disabled+
'</p>'+

'<p class="muted" style="margin-top:8px">'+
'Payments: '+payments.length+
'</p>'+

'</div>'+

'</div>';

return;

}


if(page==="clients"){

renderClients(app);

return;

}


if(page==="transactions"){

renderPayments(app);

return;

}


if(page==="payments"){

renderPayments(app);

return;

}


var titles={

ecash:"ECash",

servers:"PPPoE Servers",

plans:"PPPoE Plans",

active:"Active Connections",

cron:"Cron Logs",

pppoev2:"PPPoE V2",

ipoe:"IPoE",

mikrotik:"Mikrotik",

support:"Support Center",

account:"Account",

disbursement:"Disbursement",

telegram:"Telegram Notification"

};


var title=titles[page]||"Dashboard";


app.innerHTML=

'<div class="pageTitle">'+
esc(title)+
'</div>'+

'<div class="muted">'+
'RIDHROHAN NETWORK'+
'</div>'+

'<div class="panel" style="margin-top:20px">'+

'<h3>'+
esc(title)+
'</h3>'+

'<p class="muted">'+
'This module is ready for the next configuration.'+
'</p>'+

'<div class="notice">'+
'Hindi pa ito nakakonekta sa MikroTik. Ihahanda muna natin ang interface bago secure na API/backend connection.'+
'</div>'+

'</div>';

}


function card(label,value){

return '<div class="card">'+

'<div class="label">'+
label+
'</div>'+

'<div class="num">'+
value+
'</div>'+

'</div>';

}


function renderClients(app){

var rows="";


clients.forEach(function(c,i){

var s=statusOf(c);

var paidButton="";

if(s==="DISABLED"){

paidButton=
'<button class="btn orange" onclick="paidDisabled('+i+')">'+
'Paid'+
'</button>';

}else{

paidButton=
'<button class="btn green" onclick="paid('+i+')">'+
'Paid'+
'</button>';

}


rows+=

'<tr>'+

'<td>'+esc(c.name)+'</td>'+

'<td>'+esc(c.user)+'</td>'+

'<td>'+esc(c.plan)+'</td>'+

'<td>'+money(c.fee)+'</td>'+

'<td>'+esc(c.due||"-")+'</td>'+

'<td>'+badge(s)+'</td>'+

'<td>'+

'<div class="actions">'+

paidButton+

'<button class="btn gray" onclick="toggleDisable('+i+')">'+
(c.disabled?"Enable":"Disable")+
'</button>'+

'<button class="btn red" onclick="removeClient('+i+')">'+
'Delete'+
'</button>'+

'</div>'+

'</td>'+

'</tr>';

});


if(!rows){

rows=

'<tr>'+
'<td colspan="7" class="empty">'+
'No PPPoE clients yet.'+
'</td>'+
'</tr>';

}


app.innerHTML=

'<div class="pageTitle">PPPoE Clients</div>'+

'<div class="muted">'+
'Manage clients, due dates and payments'+
'</div>'+

'<div class="panel" style="margin-top:20px">'+

'<div class="actions" style="margin-bottom:15px">'+

'<button class="btn green" onclick="openAdd()">'+
'＋ Add Client'+
'</button>'+

'</div>'+

'<div class="tableWrap">'+

'<table class="table">'+

'<thead>'+

'<tr>'+

'<th>Name</th>'+
'<th>Username</th>'+
'<th>Plan</th>'+
'<th>Fee</th>'+
'<th>Due</th>'+
'<th>Status</th>'+
'<th>Action</th>'+

'</tr>'+

'</thead>'+

'<tbody>'+
rows+
'</tbody>'+

'</table>'+

'</div>'+

'</div>';

}


function renderPayments(app){

var total=payments.reduce(function(a,p){

return a+Number(p.amount||0);

},0);


var rows="";


payments.slice().reverse().forEach(function(p){

rows+=

'<tr>'+

'<td>'+esc(p.client)+'</td>'+

'<td>'+esc(p.username||"-")+'</td>'+

'<td>'+money(p.amount)+'</td>'+

'<td>'+esc(p.method||"Cash")+'</td>'+

'<td>'+esc(p.date||"")+'</td>'+

'<td>'+esc(p.previousDue||"-")+'</td>'+

'<td>'+esc(p.newDue||"-")+'</td>'+

'<td class="txid">'+
esc(p.transactionId||"-")+
'</td>'+

'</tr>';

});


if(!rows){

rows=

'<tr>'+
'<td colspan="8" class="empty">'+
'No payments recorded.'+
'</td>'+
'</tr>';

}


app.innerHTML=

'<div class="pageTitle">Payments</div>'+

'<div class="muted">'+
'Payment history and collection'+
'</div>'+

'<div class="cards">'+

card("Total Collected",money(total))+

card("Transactions",payments.length)+

'</div>'+

'<div class="panel">'+

'<div class="tableWrap">'+

'<table class="table">'+

'<thead>'+

'<tr>'+

'<th>Client</th>'+
'<th>Username</th>'+
'<th>Amount</th>'+
'<th>Method</th>'+
'<th>Date</th>'+
'<th>Previous Due</th>'+
'<th>New Due</th>'+
'<th>Transaction</th>'+

'</tr>'+

'</thead>'+

'<tbody>'+
rows+
'</tbody>'+

'</table>'+

'</div>'+

'</div>';

}


function showPage(page,btn){

render(page);


if(btn){

var all=document.querySelectorAll(".side button");

all.forEach(function(x){

x.classList.remove("active");

});

btn.classList.add("active");

}


if(window.innerWidth<=850){

document.getElementById("side")
.classList.remove("show");

}

}


function toggleMenu(){

document.getElementById("side")
.classList.toggle("show");

}


function togglePPPoE(){

document.getElementById("pppoeSub")
.classList.toggle("open");

}


function openAdd(){

document.getElementById("clientModal")
.classList.add("show");


document.getElementById("fName").value="";
document.getElementById("fUser").value="";
document.getElementById("fPlan").value="";
document.getElementById("fFee").value="";


var d=new Date();

d.setMonth(d.getMonth()+1);

document.getElementById("fDue")
.value=d.toISOString().slice(0,10);

}


function closeModal(){

document.getElementById("clientModal")
.classList.remove("show");

}


function saveClient(){

var name=
document.getElementById("fName")
.value.trim();

var user=
document.getElementById("fUser")
.value.trim();

var plan=
document.getElementById("fPlan")
.value.trim();

var fee=
Number(
document.getElementById("fFee")
.value||0
);

var due=
document.getElementById("fDue")
.value;


if(!name||!user){

alert(
"Ilagay ang Client Name at Username."
);

return;

}


if(fee<=0){

alert(
"Ilagay ang tamang Monthly Fee."
);

return;

}


clients.push({

name:name,

user:user,

plan:plan||"—",

fee:fee,

due:due,

disabled:false

});


saveData();

closeModal();

showPage("clients");

}


function paidDisabled(i){

alert(
"DISABLED ang client na ito.\n\n"+
"I-enable muna ang client bago mag-record ng payment."
);

}


function paid(i){

var c=clients[i];

if(!c){

alert("Client not found.");

return;

}


/* SECURITY CHECK */

if(c.disabled){

alert(
"DISABLED ang client na ito.\n\n"+
"I-enable muna ang client bago mag-record ng payment."
);

return;

}


var amount=Number(c.fee||0);


/* CONFIRMATION */

var confirmPayment=confirm(

"CONFIRM PAYMENT\n\n"+

"Client: "+c.name+"\n"+

"Username: "+c.user+"\n"+

"Plan: "+c.plan+"\n"+

"Amount: ₱"+
amount.toLocaleString("en-PH")+"\n"+

"Current Due: "+
(c.due||"-")+

"\n\nContinue?"

);


if(!confirmPayment){

return;

}


/* PAYMENT METHOD */

var method=prompt(

"Payment Method:\n\n"+
"GCash\n"+
"Maya\n"+
"Cash\n\n"+
"Type payment method:",

"Cash"

);


if(method===null){

return;

}


method=method.trim();


if(!method){

alert(
"Payment method is required."
);

return;

}


/* PREVENT DOUBLE PAYMENT */

var today=
new Date()
.toISOString()
.slice(0,10);


var alreadyPaid=payments.some(function(p){

return p.client===c.name &&
p.date===today &&
Number(p.amount||0)===amount;

});


if(alreadyPaid){

var continueDuplicate=confirm(

"May payment na para sa client na ito ngayong araw.\n\n"+
"Sigurado ka bang gusto mong mag-record ulit?"

);


if(!continueDuplicate){

return;

}

}


/* SAVE OLD DUE DATE */

var previousDue=c.due||"-";


/* CALCULATE NEW DUE */

var d;


if(c.due){

d=new Date(
c.due+"T00:00:00"
);

}else{

d=new Date();

}


if(isNaN(d.getTime())){

d=new Date();

}


d.setMonth(
d.getMonth()+1
);


var newDue=
d.toISOString()
.slice(0,10);


/* UPDATE CLIENT */

c.due=newDue;

c.disabled=false;


/* CREATE PAYMENT */

payments.push({

client:c.name,

username:c.user,

amount:amount,

method:method,

date:today,

previousDue:previousDue,

newDue:newDue,

transactionId:createTransactionID()

});


/* SAVE */

saveData();


/* SUCCESS */

alert(

"PAYMENT SUCCESSFUL\n\n"+

"Client: "+c.name+"\n"+

"Amount: ₱"+
amount.toLocaleString("en-PH")+"\n"+

"Method: "+method+"\n"+

"Previous Due: "+previousDue+"\n"+

"New Due Date: "+newDue

);


render("clients");

}


function toggleDisable(i){

if(!clients[i]){

return;

}


if(clients[i].disabled){

var enable=confirm(

"Enable this client?\n\n"+
"Client: "+clients[i].name

);


if(!enable){

return;

}


clients[i].disabled=false;

}else{

var disable=confirm(

"Disable this client?\n\n"+
"Client: "+clients[i].name+"\n\n"+
"This only changes the dashboard status for now."

);


if(!disable){

return;

}


clients[i].disabled=true;

}


saveData();

render("clients");

}


function removeClient(i){

if(!clients[i]){

return;

}


var c=clients[i];


var yes=confirm(

"DELETE CLIENT?\n\n"+

"Client: "+c.name+"\n"+
"Username: "+c.user+"\n\n"+

"This action cannot be undone."

);


if(!yes){

return;

}


clients.splice(i,1);

saveData();

render("clients");

}


function logout(){

alert(

"Static prototype: logout is not connected to a server yet."

);

}


function start(){

safeLoad();

render("dashboard");

}


window.addEventListener(
"load",
start
);

</script>
