<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RIDHROHAN NETWORK</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#07111f;
  color:#fff;
  font-family:Arial,sans-serif
}

#login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px
}

.box{
  width:100%;
  max-width:390px;
  background:#101e30;
  border:1px solid #24364b;
  border-radius:22px;
  padding:30px 22px;
  text-align:center
}

.logo{
  width:82px;
  height:82px;
  margin:auto;
  background:#087cf5;
  border-radius:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  font-weight:bold
}

h1{
  font-size:24px;
  margin:18px 0 8px
}

.sub{
  color:#a8b5c7;
  margin-bottom:25px;
  font-size:16px
}

input{
  display:block!important;
  width:100%!important;
  height:56px!important;
  margin:0 0 13px!important;
  padding:0 16px!important;
  background:#071422!important;
  color:#fff!important;
  border:1px solid #33465d!important;
  border-radius:12px!important;
  font-size:16px!important;
  opacity:1!important;
  visibility:visible!important
}

input::placeholder{
  color:#8290a3
}

button{
  display:block!important;
  width:100%!important;
  height:56px!important;
  border:0;
  border-radius:12px;
  background:#087cf5;
  color:#fff;
  font-size:17px;
  font-weight:bold
}

#error{
  display:none;
  color:#ff7180;
  margin-top:13px
}

#dash{
  display:none;
  min-height:100vh
}

.top{
  height:64px;
  background:#101e30;
  padding:0 18px;
  display:flex;
  align-items:center;
  font-weight:bold
}

.side{
  position:fixed;
  top:64px;
  bottom:0;
  width:235px;
  background:#0c1827;
  padding:14px
}

.item{
  padding:13px;
  border-radius:9px;
  color:#b9c5d4;
  margin:3px 0
}

.active{
  background:#087cf5;
  color:#fff
}

.main{
  margin-left:235px;
  padding:25px
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px
}

.card{
  background:#101e30;
  border:1px solid #24364b;
  border-radius:14px;
  padding:20px
}

@media(max-width:700px){
  .side{
    position:static;
    width:100%;
    height:auto
  }
