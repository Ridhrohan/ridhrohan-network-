<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIDHROHAN NETWORK</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#061121;--panel:#0b1d34;--panel2:#102744;--line:#21466f;
 --text:#edf5ff;--muted:#91a9c8;--green:#079875;--blue:#17579a;
 --red:#ad3045;--gray:#263e5c;--yellow:#d7a72c;
}
body{font-family:Arial,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.top{height:112px;background:#091b32;border-bottom:2px solid #18385c;display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}
.brand{font-size:30px;font-weight:800;letter-spacing:.5px}
.tag{color:var(--muted);font-size:17px;margin-top:5px}
.menuBtn{width:82px;height:82px;border:2px solid #28517d;border-radius:18px;background:#102b4c;color:white;font-size:38px}
.drawer{position:fixed;top:112px;left:0;bottom:0;width:430px;max-width:88%;background:#071a30;border-right:2px solid #24476d;z-index:30;overflow:auto;padding:28px 26px;display:none}
.drawer.open{display:block}
.nav{display:block;width:100%;padding:18px 22px;color:#b9cbe1;background:transparent;text-align:left;border-radius:17px;margin-bottom:5px;font-size:22px}
.nav:hover,.nav.active{background:#153b66;color:white}
.sub{display:none;padding:3px 0 10px 24px}
.sub.open{display:block}
.sub button{display:block;width:100%;text-align:left;padding:14px 18px;background:transparent;color:#b9cbe1;border-radius:12px;font-size:20px}
.sub button:hover{background:#102b4c;color:white}
.settings{font-size:14px;color:#6885a7;text-transform:uppercase;margin:28px 22px 8px}
main{padding:34px 30px 110px;max-width:1400px;margin:auto}
.pageTitle{font-size:38px;margin-bottom:8px}
.pageSub{font-size:20px;color:var(--muted);margin-bottom:30px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:28px}
.card,.panel{background:var(--panel);border:2px solid #183b64;border-radius:22px}
.card{padding:27px}
.card label{color:var(--muted);font-size:18px}
.card strong{display:block;font-size:38px;margin-top:14px}
.panel{padding:30px;margin-bottom:25px}
.panel h2{font-size:27px;margin-bottom:22px}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.btn{padding:15px 22px;border-radius:14px;color:white;font-size:18px;background:var(--gray)}
.btn.green{background:var(--green)}
.btn.blue{background:var(--blue)}
.btn.red{background:var(--red)}
.btn.small{padding:11px 16px;font-size:16px}
.notice{padding:18px;border:2px dashed #31577f;border-radius:17px;color:#a8bed9;font-size:17px;margin-top:22px}
.tableWrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:18px 16px;border-bottom:1px solid #1d3a5b;font-size:17px;white-space:nowrap}
th{color:#87a3c5;font-size:16px;text-transform:uppercase}
.badge{display:inline-block;padding:8px 13px;border-radius:20px;font-size:14px;font-weight:bold}
.badge.active{background:#087c62;color:#9effe5}
.badge.disabled{background:#34465d;color:#d2dce8}
.badge.expired{background:#813045;color:#ffd0d9}
.formGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.field label{display:block;color:#9bb2cf;margin-bottom:8px;font-size:16px}
.field input,.field select{width:100%;padding:15px;background:#061424;color:white;border:2px solid #2a4e77;border-radius:13px;outline:none}
.modalBg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modalBg.show{display:flex}
.modal{width:100%;max-width:620px;background:#0b2039;border:2px solid #31577f;border-radius:24px;padding:30px;max-height:90vh;overflow:auto}
.modal h2{font-size:30px;margin-bottom:24px}
.modalActions{display:flex;gap:12px;margin-top:22px}
.modalActions button{flex:1}
.empty{padding:35px;text-align:center;color:#8fa8c6}
.bottom{position:fixed;left:0;right:0;bottom:0;height:92px;background:#081b31;border-top:2px solid #18385c;display:grid;grid-template-columns:repeat(5,1fr);z-index:25}
.bottom button{background:transparent;color:#9ab0cc;font-size:15px}
.bottom b{display:block;font-size:27px;color:#dbeaff;margin-bottom:5px}
@media(max-width:800px){
 .top{height:112px;padding:0 20px}.brand{font-size:25px}.tag{font-size:15px}.menuBtn{width:70px;height:70px}
 main{padding:28px 18px 110px}.pageTitle{font-size:32px}.cards{grid-template-columns:repeat(2,1fr);gap:12px}.card{padding:20px}.card strong{font-size:32px}
 .formGrid{grid-template-columns:1fr}.drawer{top:112px;width:410px}.panel{padding:22px}
}
</style>
</head>
<body>

<header class="top">
  <div>
    <div class="brand">RIDHROHAN NETWORK</div>
    <div class="tag">Network Management System</div>
  </div>
  <button class="menuBtn" onclick="toggleDrawer()">☰</button>
</header>

<aside id="drawer" class="drawer">
  <button class="nav" onclick="go('dashboard')">⌂ &nbsp; Dashboard</button>
  <button class="nav" onclick="go('ecash')">₱ &nbsp; ECash</button>
  <button class="nav active" onclick="togglePPPoE()">⊙ &nbsp; PPPoE <span style="float:right">⌄</span></button>
  <div id="pppSub" class="sub open">
    <button onclick="go('servers')">Servers</button>
    <button onclick="go('plans')">Plans</button>
    <button onclick="go('clients')">Clients</button>
    <button onclick="go('transactions')">Transactions</button>
    <button onclick="go('active')">Active Connections</button>
    <button onclick="go('cron')">Cron Logs</button>
  </div>
  <button class="nav" onclick="go('pppov2')">⊙ &nbsp; PPPoE V2</button>
  <button class="nav" onclick="go('ipoe')">⊙ &nbsp; IPoE</button>
  <button class="nav" onclick="go('mikrotik')">⚙ &nbsp; Mikrotik</button>
  <button class="nav" onclick="go('payments')">₱ &nbsp; Payments</button>
  <button class="nav" onclick="go('support')">? &nbsp; Support Center</button>
  <div class="settings">Settings</div>
  <button class="nav" onclick="go('account')">Account</button>
  <button class="nav" onclick="go('disbursement')">Disbursement</button>
  <button class="nav" onclick="go('telegram')">Telegram Notification</button>
  <button class="nav" onclick="alert('Sign out is not enabled in this prototype.')">Sign out</button>
</aside>

<main id="app"></main>

<nav class="bottom">
  <button onclick="go('dashboard')"><b>⌂</b>Home</button>
  <button onclick="go('clients')"><b>⊙</b>Clients</button>
  <button onclick="openClientModal()"><b>＋</b>Add</button>
  <button onclick="go('payments')"><b>₱</b>Payments</button>
  <button onclick="toggleDrawer()"><b>☰</b>Menu</button>
</nav>

<div id="modalBg" class="modalBg">
  <div class="modal">
    <h2 id="modalTitle">Add PPPoE Client</h2>
    <div class="formGrid">
      <div class="field"><label>Client Name</label><input id="fName" placeholder="Juan Dela Cruz"></div>
      <div class="field"><label>Username</label><input id="fUser" placeholder="juan123"></div>
      <div class="field"><label>Plan</label><select id="fPlan"></select></div>
      <div class="field"><label>Due Date</label><input id="fDue" type="date"></div>
    </div>
    <div class="modalActions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn green" onclick="saveClient()">Save Client</button>
    </div>
  </div>
</div>

<div id="planModal" class="modalBg">
  <div class="modal">
    <h2 id="planModalTitle">Add PPPoE Plan</h2>
    <div class="formGrid">
      <div class="field"><label>Plan Name</label><input id="pName" placeholder="25 Mbps"></div>
      <div class="field"><label>Speed</label><input id="pSpeed" placeholder="25 Mbps"></div>
      <div class="field"><label>Monthly Price</label><input id="pPrice" type="number" placeholder="1000"></div>
    </div>
    <div class="modalActions">
      <button class="btn" onclick="closePlanModal()">Cancel</button>
      <button class="btn green" onclick="savePlan()">Save Plan</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

var clients = [];
var payments = [];
var plans = [];
var editingClient = -1;
var editingPlan = -1;

function read(key, fallback){
  try{
    var x=localStorage.getItem(key);
    if(!x) return fallback;
    var y=JSON.parse(x);
    return y;
  }catch(e){ return fallback; }
}
function save(){
  try{
    localStorage.setItem("RN_CLIENTS",JSON.stringify(clients));
    localStorage.setItem("RN_PAYMENTS",JSON.stringify(payments));
    localStorage.setItem("RN_PLANS",JSON.stringify(plans));
  }catch(e){}
}
function money(n){return "₱"+Number(n||0).toLocaleString("en-PH")}
function today(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function addMonth(dateStr){
  var d=new Date(dateStr+"T12:00:00");
  d.setMonth(d.getMonth()+1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function status(c){
  if(c.disabled) return "DISABLED";
  if(c.due && c.due<today()) return "EXPIRED";
  return "ACTIVE";
}
function planFor(c){
  for(var i=0;i<plans.length;i++) if(plans[i].name===c.plan) return plans[i];
  return {name:c.plan||"Plan",speed:c.plan||"",price:Number(c.fee||0)};
}
function init(){
  clients=read("RN_CLIENTS",[]);
  payments=read("RN_PAYMENTS",[]);
  plans=read("RN_PLANS",[]);
  if(!Array.isArray(clients)) clients=[];
  if(!Array.isArray(payments)) payments=[];
  if(!Array.isArray(plans)||!plans.length){
    plans=[
      {name:"10 Mbps",speed:"10 Mbps",price:500,active:true},
      {name:"15 Mbps",speed:"15 Mbps",price:700,active:true},
      {name:"25 Mbps",speed:"25 Mbps",price:1000,active:true},
      {name:"50 Mbps",speed:"50 Mbps",price:1500,active:true}
    ];
  }
  save();
  dashboard();
}
window.toggleDrawer=function(){document.getElementById("drawer").classList.toggle("open")};
window.togglePPPoE=function(){document.getElementById("pppSub").classList.toggle("open")};

window.go=function(page){
  document.getElementById("drawer").classList.remove("open");
  if(page==="dashboard") dashboard();
  else if(page==="ecash") modulePage("ECash");
  else if(page==="servers") modulePage("PPPoE Servers");
  else if(page==="plans") plansPage();
  else if(page==="clients") clientsPage();
  else if(page==="transactions") transactionsPage();
  else if(page==="active") activePage();
  else if(page==="cron") modulePage("Cron Logs");
  else if(page==="pppov2") modulePage("PPPoE V2");
  else if(page==="ipoe") modulePage("IPoE");
  else if(page==="mikrotik") modulePage("Mikrotik");
  else if(page==="payments") paymentsPage();
  else if(page==="support") modulePage("Support Center");
  else if(page==="account") modulePage("Account Settings");
  else if(page==="disbursement") modulePage("Disbursement");
  else if(page==="telegram") modulePage("Telegram Notification");
};

function shell(title,sub,body){
  document.getElementById("app").innerHTML=
    '<div class="pageTitle">'+title+'</div>'+
    '<div class="pageSub">'+sub+'</div>'+body;
}
function dashboard(){
  var active=0,expired=0;
  for(var i=0;i<clients.length;i++){
    if(status(clients[i])==="ACTIVE") active++;
    if(status(clients[i])==="EXPIRED") expired++;
  }
  var total=0;
  for(var j=0;j<payments.length;j++) total+=Number(payments[j].amount||0);
  shell("Dashboard","RIDHROHAN NETWORK overview",
    '<div class="cards">'+
    card("Clients",clients.length)+card("Active",active)+card("Expired",expired)+card("Collected",money(total))+
    '</div>'+
    '<div class="panel"><h2>Quick Actions</h2><div class="actions">'+
    '<button class="btn green" onclick="openClientModal()">＋ Add PPPoE Client</button>'+
    '<button class="btn blue" onclick="go(\'clients\')">View Clients</button>'+
    '<button class="btn" onclick="go(\'plans\')">Manage Plans</button>'+
    '<button class="btn" onclick="go(\'payments\')">Payment History</button>'+
    '</div><div class="notice">Prototype mode. Hindi pa nakakonekta sa MikroTik. Ihahanda muna natin ang secure backend/API connection.</div></div>'+
    '<div class="panel"><h2>System</h2><p style="color:var(--muted);font-size:18px">RIDHROHAN NETWORK • PPPoE Management System</p></div>'
  );
}
function card(a,b){return '<div class="card"><label>'+a+'</label><strong>'+b+'</strong></div>'}

function modulePage(name){
  shell(name,"RIDHROHAN NETWORK",
    '<div class="panel"><h2>'+name+'</h2>'+
    '<p style="color:var(--muted);font-size:19px">Module ready. Configuration can be added here.</p>'+
    '<div class="notice">'+(name==="Mikrotik"?"Hindi pa ito direktang nakakonekta sa MikroTik. Gumamit tayo ng secure backend/API bago mag-enable ng remote control.":"This module is ready for the next configuration.")+'</div></div>');
}

function plansPage(){
  var rows="";
  for(var i=0;i<plans.length;i++){
    var p=plans[i];
    rows+='<tr><td>'+esc(p.name)+'</td><td>'+esc(p.speed)+'</td><td>'+money(p.price)+'</td>'+
      '<td><span class="badge '+(p.active===false?"disabled":"active")+'">'+(p.active===false?"DISABLED":"ACTIVE")+'</span></td>'+
      '<td><button class="btn blue small" onclick="editPlan('+i+')">Edit</button> '+
      '<button class="btn '+(p.active===false?"green":"")+' small" onclick="togglePlan('+i+')">'+(p.active===false?"Activate":"Deactivate")+'</button> '+
      '<button class="btn red small" onclick="deletePlan('+i+')">Delete</button></td></tr>';
  }
  shell("PPPoE Plans","Manage internet packages and monthly pricing",
    '<div class="panel"><button class="btn green" onclick="openPlanModal()">＋ Add Plan</button>'+
    '<div class="tableWrap" style="margin-top:25px"><table><tr><th>Plan Name</th><th>Speed</th><th>Monthly Price</th><th>Status</th><th>Action</th></tr>'+
    (rows||'<tr><td colspan="5" class="empty">No plans</td></tr>')+'</table></div></div>');
}
function clientsPage(){
  var rows="";
  for(var i=0;i<clients.length;i++){
    var c=clients[i], s=status(c), p=planFor(c);
    rows+='<tr><td>'+esc(c.name)+'</td><td>'+esc(c.user)+'</td><td>'+esc(p.speed||c.plan)+'</td><td>'+money(c.fee)+'</td><td>'+esc(c.due)+'</td>'+
      '<td><span class="badge '+(s==="ACTIVE"?"active":s==="EXPIRED"?"expired":"disabled")+'">'+s+'</span></td>'+
      '<td><button class="btn green small" onclick="pay('+i+')">Paid</button> '+
      '<button class="btn small" onclick="toggleClient('+i+')">'+(c.disabled?"Enable":"Disable")+'</button> '+
      '<button class="btn red small" onclick="deleteClient('+i+')">Delete</button></td></tr>';
  }
  shell("PPPoE Clients","Manage clients, plans and due dates",
    '<div class="panel"><button class="btn green" onclick="openClientModal()">＋ Add Client</button>'+
    '<div class="tableWrap" style="margin-top:25px"><table><tr><th>Name</th><th>Username</th><th>Plan</th><th>Fee</th><th>Due</th><th>Status</th><th>Action</th></tr>'+
    (rows||'<tr><td colspan="7" class="empty">No clients yet</td></tr>')+'</table></div></div>');
}
function transactionsPage(){paymentsPage()}
function paymentsPage(){
  var total=0,rows="";
  for(var i=0;i<payments.length;i++){
    var p=payments[i];total+=Number(p.amount||0);
    rows+='<tr><td>'+esc(p.client)+'</td><td>'+esc(p.user)+'</td><td>'+money(p.amount)+'</td><td>'+esc(p.method)+'</td><td>'+esc(p.date)+'</td></tr>';
  }
  shell("Payments","Payment history and collections",
    '<div class="cards">'+card("Collected",money(total))+card("Transactions",payments.length)+'</div>'+
    '<div class="panel"><h2>Payment History</h2><div class="tableWrap"><table><tr><th>Client</th><th>Username</th><th>Amount</th><th>Method</th><th>Date</th></tr>'+
    (rows||'<tr><td colspan="5" class="empty">No payments yet</td></tr>')+'</table></div></div>');
}
function activePage(){
  var rows="";
  for(var i=0;i<clients.length;i++) if(status(clients[i])==="ACTIVE"){
    var c=clients[i];
    rows+='<tr><td>'+esc(c.name)+'</td><td>'+esc(c.user)+'</td><td>'+esc(c.plan)+'</td><td>'+esc(c.due)+'</td><td><span class="badge active">CONNECTED</span></td></tr>';
  }
  shell("Active Connections","Current active PPPoE clients",
    '<div class="panel"><div class="tableWrap"><table><tr><th>Client</th><th>Username</th><th>Plan</th><th>Due</th><th>Status</th></tr>'+
    (rows||'<tr><td colspan="5" class="empty">No active clients</td></tr>')+'</table></div></div>');
}

window.openClientModal=function(index){
  editingClient=(typeof index==="number"?index:-1);
  document.getElementById("modalTitle").textContent=editingClient>=0?"Edit PPPoE Client":"Add PPPoE Client";
  var sel=document.getElementById("fPlan");sel.innerHTML="";
  for(var i=0;i<plans.length;i++) if(plans[i].active!==false)
    sel.innerHTML+='<option value="'+escAttr(plans[i].name)+'">'+esc(plans[i].name)+' — '+money(plans[i].price)+'/month</option>';
  var c=editingClient>=0?clients[editingClient]:null;
  document.getElementById("fName").value=c?c.name:"";
  document.getElementById("fUser").value=c?c.user:"";
  document.getElementById("fDue").value=c?c.due:today();
  if(c) sel.value=c.plan;
  document.getElementById("modalBg").classList.add("show");
};
window.closeModal=function(){document.getElementById("modalBg").classList.remove("show")};
window.saveClient=function(){
  var name=document.getElementById("fName").value.trim();
  var user=document.getElementById("fUser").value.trim();
  var plan=document.getElementById("fPlan").value;
  var due=document.getElementById("fDue").value;
  if(!name||!user||!plan||!due){alert("Pakilagyan lahat ng fields.");return}
  var p=planFor({plan:plan});
  var obj={name:name,user:user,plan:plan,fee:Number(p.price||0),due:due,disabled:false};
  if(editingClient>=0) clients[editingClient]=Object.assign({},clients[editingClient],obj);
  else clients.push(obj);
  save();closeModal();clientsPage();
};
window.toggleClient=function(i){
  if(!clients[i])return;
  clients[i].disabled=!clients[i].disabled;save();clientsPage();
};
window.deleteClient=function(i){
  if(!clients[i])return;
  if(confirm("Delete client "+clients[i].name+"?")){clients.splice(i,1);save();clientsPage()}
};
window.pay=function(i){
  var c=clients[i];if(!c)return;
  if(c.disabled){alert("Disabled ang client. I-enable muna bago mag-record ng payment.");return}
  var amount=Number(c.fee||0);
  if(amount<=0){alert("Invalid payment amount.");return}
  var method=prompt("Payment method: GCash / Maya / Cash","Cash");
  if(!method)return;
  var newDue=addMonth(c.due||today());
  if(!confirm("Payment: "+money(amount)+"\nClient: "+c.name+"\nMethod: "+method+"\nNew Due Date: "+newDue))return;
  c.due=newDue;c.disabled=false;
  payments.push({client:c.name,user:c.user,amount:amount,method:method,date:today()});
  save();alert("PAYMENT SUCCESSFUL!\n\nClient: "+c.name+"\nAmount: "+money(amount)+"\nMethod: "+method+"\nNew Due Date: "+newDue);clientsPage();
};

window.openPlanModal=function(index){
  editingPlan=(typeof index==="number"?index:-1);
  document.getElementById("planModalTitle").textContent=editingPlan>=0?"Edit PPPoE Plan":"Add PPPoE Plan";
  var p=editingPlan>=0?plans[editingPlan]:null;
  document.getElementById("pName").value=p?p.name:"";
  document.getElementById("pSpeed").value=p?p.speed:"";
  document.getElementById("pPrice").value=p?p.price:"";
  document.getElementById("planModal").classList.add("show");
};
window.closePlanModal=function(){document.getElementById("planModal").classList.remove("show")};
window.savePlan=function(){
  var name=document.getElementById("pName").value.trim();
  var speed=document.getElementById("pSpeed").value.trim();
  var price=Number(document.getElementById("pPrice").value);
  if(!name||!speed||price<=0){alert("Pakilagyan nang tama ang plan.");return}
  var obj={name:name,speed:speed,price:price,active:true};
  if(editingPlan>=0) plans[editingPlan]=Object.assign({},plans[editingPlan],obj);
  else plans.push(obj);
  save();closePlanModal();plansPage();
};
window.editPlan=function(i){openPlanModal(i)};
window.togglePlan=function(i){if(plans[i]){plans[i].active=plans[i].active===false;save();plansPage()}};
window.deletePlan=function(i){
  if(!plans[i])return;
  if(confirm("Delete plan "+plans[i].name+"?")){plans.splice(i,1);save();plansPage()}
};
function esc(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function escAttr(x){return esc(x).replace(/'/g,"&#39;")}

window.addEventListener("load",function(){init()});
})();
</script>
</body>
</html>
